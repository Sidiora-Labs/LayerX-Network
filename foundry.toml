[profile.default]
src = "contracts"
test = "test"
out = "build/forge-artifacts"
cache_path = "build/forge-cache"
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 100000
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
extra_output = ["storageLayout"]
# contracts/src and contracts/test belong to the Paxeer chain Foundry project
# (foundry.paxeer.toml, libs under contracts/lib, npm deps under
# contracts/node_modules); keep them out of this one.
skip = ["contracts/src/**", "contracts/test/**", "contracts/lib/**", "contracts/node_modules/**"]
fs_permissions = [
    { access = "read", path = "./contracts/config" },
    { access = "read", path = "./tests/vectors/checkpoint" },
]

[fmt]
ignore = ["contracts/src/**/*.sol", "contracts/test/**/*.sol", "contracts/lib/**/*.sol", "contracts/node_modules/**/*.sol"]

[fuzz]
runs = 10000

[invariant]
runs = 1000
depth = 128
fail_on_revert = true
