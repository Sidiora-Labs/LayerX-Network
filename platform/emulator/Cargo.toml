[package]
name = "layerx-platform-emulator"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "layerx_platform_emulator"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ed25519-dalek = "=2.2.0"
layerx-types = { path = "../../agent/crates/layerx-types" }
layerx-wire = { path = "../../agent/crates/layerx-wire" }
layerx-proof = { path = "../../agent/crates/layerx-proof" }
layerx-programs-runtime = { path = "../../programs/crates/layerx-programs-runtime", features = ["host-ffi"] }
layerx-programs-sandbox = { path = "../../programs/crates/layerx-programs-sandbox", features = ["host-ffi"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
