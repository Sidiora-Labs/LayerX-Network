[workspace]
members = [
    "ramps/toolkit",
    "ramps/reference",
    "cli",
    "emulator",
    "hosted/faucet",
    "hosted/gateway",
    "hosted/registry",
    "hosted/webhooks",
    "hosted/dashboard",
    "hosted/testnet",
    "sdk/generators",
    "release",
    "tools/kvx",
    "tools/workspace-gate",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
license = "LicenseRef-Centra-ai-Protocol"

[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
ed25519-dalek = "=2.2.0"
getrandom = "=0.3.4"
keyring = "=4.1.6"
keyring-core = "=1.0.0"
native-tls = "=0.2.15"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
layerx-fiat = { path = "../interop/crates/layerx-fiat" }
layerx-proof = { path = "../agent/crates/layerx-proof" }
layerx-sdk = { path = "../agent/crates/layerx-sdk" }
layerx-crypto = { path = "../agent/crates/layerx-crypto" }
layerx-types = { path = "../agent/crates/layerx-types" }
layerx-wire = { path = "../agent/crates/layerx-wire" }
layerx-intents = { path = "../human/crates/layerx-intents" }
layerx-paxeer-client = { path = "../human/crates/layerx-paxeer-client" }
layerx-platform-kvx = { path = "tools/kvx", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
ureq = { version = "=3.4.0", default-features = false, features = ["json", "native-tls-no-default"] }
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
