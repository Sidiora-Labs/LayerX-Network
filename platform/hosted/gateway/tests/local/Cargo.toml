[package]
name = "layerx-gateway-local-qualification"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"

[dependencies]
layerx-proof = { path = "../../../../../agent/crates/layerx-proof" }
layerx-platform-core = { path = "../../../core" }
layerx-platform-authority = { path = "../../../authority" }
serde_json = "1"
layerx-types = { path = "../../../../../agent/crates/layerx-types" }
layerx-wire = { path = "../../../../../agent/crates/layerx-wire" }

[dev-dependencies]
layerx-intents = { path = "../../../../../human/crates/layerx-intents" }
ed25519-dalek = "2.2"
layerx-client = { path = "../../../../../agent/crates/layerx-client" }
layerx-crypto = { path = "../../../../../agent/crates/layerx-crypto" }
layerx-programs-registry = { path = "../../../../../programs/crates/layerx-programs-registry" }
native-tls = "0.2"
sha2 = "0.10"

[[bin]]
name = "gateway-lifecycle-receipt-verify"
path = "verifier.rs"

[[test]]
name = "lifecycle"
path = "lifecycle.rs"
