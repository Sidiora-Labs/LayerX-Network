apiVersion: v1
kind: Service
metadata:
  name: layerx-human
  namespace: layerx-testnet
    spec:
  selector:
      app: layerx-node
    ports:
  - name: https
    port: 9443
    targetPort: human-https
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
      podSelector:
        matchLabels:
  policyTypes:
  - Ingress
  ingress:
    - from:
    - namespaceSelector:
          kubernetes.io/metadata.name: layerx-internal
        matchExpressions:
        - key: app
          operator: In
          values:
          - layerx-internal-journeys
          - layerx-internal-approvals
    - podSelector:
          app: layerx-qualification
    - protocol: TCP
      port: human-https
metadata: {name: human-adapter-egress, namespace: layerx-internal}
    matchExpressions: [{key: app, operator: In, values: [layerx-internal-journeys, layerx-internal-approvals]}]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: layerx-testnet}}
          podSelector: {matchLabels: {app: layerx-node}}
      ports: [{protocol: TCP, port: 9447}]
metadata: {name: layerx-human, namespace: layerx-testnet}
  selector: {app: layerx-human}
  ports: [{name: https, port: 9443, targetPort: https}]
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: layerx-human-state, namespace: layerx-testnet}
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 4Gi}}
apiVersion: apps/v1
kind: Deployment
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: layerx-human}}
  template:
    metadata: {labels: {app: layerx-human}}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 4020, runAsGroup: 4020, fsGroup: 4020}
      containers:
        - name: human
          image: ghcr.io/sidiora-labs/layerx-human:0.1.0
          imagePullPolicy: Always
          env:
            - {name: LAYERX_HUMAN_BIND, value: "0.0.0.0:9443"}
            - {name: LAYERX_HUMAN_TLS_CERT_DER, value: /run/layerx/tls/server.crt.der}
            - {name: LAYERX_HUMAN_TLS_KEY_DER, value: /run/layerx/tls/server.key.der}
            - {name: LAYERX_HUMAN_COMPONENT_SOCKET, value: /run/layerx/human/components.sock}
            - {name: LAYERX_HUMAN_WEB_ORIGIN, value: "https://human.testnet.layerx.network"}
          ports: [{name: https, containerPort: 9443}]
          readinessProbe:
            exec:
              command: [curl, --fail, --silent, --show-error, --max-time, "5", --cacert, /run/layerx/tls/ca.crt, "https://localhost:9443/readyz"]
            timeoutSeconds: 6
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /livez, port: https, scheme: HTTPS}
            initialDelaySeconds: 10
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: tls, mountPath: /run/layerx/tls, readOnly: true}
            - {name: run, mountPath: /run/layerx/human}
        - name: components
          command: [/usr/local/bin/layerx-human-components]
          envFrom:
            - secretRef: {name: layerx-human-components-config}
            - {name: LAYERX_HUMAN_COMPONENT_ALLOWED_UID, value: "4020"}
            - {name: LAYERX_HUMAN_COMPONENT_WORKERS, value: "4"}
            - {name: LAYERX_HUMAN_COMPONENT_QUEUE_CAPACITY, value: "4"}
            - {name: LAYERX_HUMAN_MAINTENANCE_INTERVAL_SECONDS, value: "10"}
            - {name: LAYERX_HUMAN_MAINTENANCE_MAXIMUM_ITEMS, value: "100"}
            - {name: LAYERX_HUMAN_STORE_ROOT, value: /var/lib/layerx/human/store}
            - {name: LAYERX_HUMAN_CUSTODY_ROOT, value: /var/lib/layerx/human/custody}
            - {name: LAYERX_HUMAN_AUTH_INDEX_ROOT, value: /var/lib/layerx/human/auth-index}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
            - {name: state, mountPath: /var/lib/layerx/human}
            - {name: component-material, mountPath: /run/layerx/material, readOnly: true}
      volumes:
        - {name: tls, secret: {secretName: layerx-human-tls, defaultMode: 0440}}
        - {name: run, emptyDir: {}}
        - {name: state, persistentVolumeClaim: {claimName: layerx-human-state}}
        - {name: component-material, secret: {secretName: layerx-human-component-material, defaultMode: 0440}}
  podSelector: {matchLabels: {app: layerx-human}}
  policyTypes: [Ingress, Egress]
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: layerx-internal}}
          podSelector: {matchExpressions: [{key: app, operator: In, values: [layerx-internal-journeys, layerx-internal-approvals]}]}
        - podSelector: {matchLabels: {app: layerx-qualification}}
      ports: [{protocol: TCP, port: https}]
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
