apiVersion: v1
kind: ConfigMap
metadata: {name: layerx-node-config, namespace: layerx-testnet}
data:
  network-id: "402"
  network-name: layerx-testnet
  asset-id: "b5a32b12029f8ddfb905f90f280f664b46390de0fc62770fc197dd87b18cd898"
  replica-id: "6c61796572782d626574612d726563656970742d617574686f726974792d3031"
  paxeer-relay-port: "18545"
---
apiVersion: v1
kind: Service
metadata: {name: layerx-node, namespace: layerx-testnet}
spec: {clusterIP: None, selector: {app: layerx-node}, ports: [{name: core-tls, port: 9443, targetPort: core-tls}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: layerx-node, namespace: layerx-testnet}
spec:
  serviceName: layerx-node
  replicas: 1
  selector: {matchLabels: {app: layerx-node}}
  template:
    metadata: {labels: {app: layerx-node, layerx-plane: trusted-boundary}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 4020, runAsGroup: 4020, fsGroup: 4020}
      automountServiceAccountToken: false
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 60
      initContainers:
      - name: human-directories
        image: ghcr.io/sidiora-labs/layerx-human:0.1.0
          imagePullPolicy: Always
        command:
        - /bin/sh
        - -ec
            - |
          install -d -o 4020 -g 4020 -m 0750 /run/layerx/human
          install -d -o 4021 -g 4020 -m 0750 /run/layerx/human/owner
          install -d -o 4020 -g 4020 -m 0700 /human-state/components
          install -d -o 4021 -g 4020 -m 0700 /human-state/agent
          install -d -o 4020 -g 4020 -m 0700 /human-state/identity
          install -d -o 4020 -g 4020 -m 0700 /human-state/security
          install -d -o 4020 -g 4020 -m 0700 /human-state/movement
          install -d -o 4020 -g 4020 -m 0700 /human-state/movement/evidence
          install -d -o 4021 -g 4020 -m 0700 /human-state/authority
          install -d -o 4026 -g 4020 -m 0700 /human-state/kms
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 4020
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
            - DAC_OVERRIDE
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
          volumeMounts:
        - name: run
          mountPath: /run/layerx
        - name: human-state
          mountPath: /human-state
      - name: human-authority-material
          command: [/bin/sh, -ec]
          args:
            umask 077
            install -d -m 0700 /run/authority-private/material
            install -m 0600 /run/authority-input/authority-token /run/authority-private/material/human-agent.token
            install -m 0600 /run/authority-input/principal-policy.json /run/authority-private/material/principal-policy.json
            install -m 0600 /run/module-registry/registry.json /run/authority-private/material/registry.json
        securityContext: {runAsUser: 4021, runAsGroup: 4020, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
          - {name: human-authority, mountPath: /run/authority-input, readOnly: true}
          - {name: human-authority-private, mountPath: /run/authority-private}
          - {name: human-module-registry, mountPath: /run/module-registry, readOnly: true}
        - name: guarantor-storage
          image: ghcr.io/sidiora-labs/layerx-node:0.1.0
              mkdir -p /var/lib/layerx/guarantor-submitter
              chmod 2770 /var/lib/layerx/guarantor-submitter
              for identity in 1 2; do
                mkdir -p "/var/lib/layerx/guarantor-$identity/identity" "/var/lib/layerx/guarantor-$identity/state"
                chmod 0750 "/var/lib/layerx/guarantor-$identity" "/var/lib/layerx/guarantor-$identity/identity"
                chmod 2770 "/var/lib/layerx/guarantor-$identity/state"
              done
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
            - {name: data, mountPath: /var/lib/layerx}
      containers:
        - name: layerxd
          image: ghcr.io/sidiora-labs/layerx-node:0.1.0
          imagePullPolicy: Always
          command: [/opt/layerx/supervisor.sh]
          args:
            - --role
            - sequencer
            - --data-dir
            - /var/lib/layerx/node
            - --run-dir
            - /run/layerx/node
            - --
            - --network-id
            - $(LAYERX_NODE_NETWORK_ID)
            - --asset
            - $(LAYERX_NODE_ASSET_ID)
            - --replica-id
            - $(LAYERX_NODE_REPLICA_ID)
            - --sequencer-key
            - /run/layerx/keys/sequencer.key
            - --treasury-key
            - /run/layerx/keys/treasury.key
            - --program-token-file
            - /run/layerx/tokens/program-token
            - --replica-token-file
            - /run/layerx/tokens/replica-token
            - --program-port
            - "9401"
            - --replica-port
            - "9402"
            - --lni-uid
            - "4021"
            - --lni-gid
            - "4020"
            - --settlement-env
            - /run/layerx/settlement/settlement.env
          env:
            - {name: LAYERX_NODE_NETWORK_ID, valueFrom: {configMapKeyRef: {name: layerx-node-config, key: network-id}}}
            - {name: LAYERX_NODE_ASSET_ID, valueFrom: {configMapKeyRef: {name: layerx-node-config, key: asset-id}}}
            - {name: LAYERX_NODE_REPLICA_ID, valueFrom: {configMapKeyRef: {name: layerx-node-config, key: replica-id}}}
          resources: {requests: {cpu: 500m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/layerx}
            - {name: run, mountPath: /run/layerx}
            - {name: keys, mountPath: /run/layerx/keys, readOnly: true}
            - {name: tokens, mountPath: /run/layerx/tokens, readOnly: true}
            - {name: settlement, mountPath: /run/layerx/settlement, readOnly: true}
            - {name: tmp, mountPath: /tmp}
        - name: guarantor-1
          image: ghcr.io/sidiora-labs/layerx-node:0.1.0
          imagePullPolicy: Always
          command: [/opt/layerx/guarantor.sh]
          securityContext: {runAsUser: 4021, runAsGroup: 4020, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - {name: LAYERX_GUARANTOR_IDENTITY_DIR, value: /var/lib/guarantor/identity}
            - {name: LAYERX_GUARANTOR_STATE_DIR, value: /var/lib/guarantor/state}
            - {name: LAYERX_GUARANTOR_LNI_SOCKET, value: /run/layerx/node/layerxd.lni.sock}
            - {name: LAYERX_GUARANTOR_SETTLEMENT_ENV, value: /run/layerx/settlement/settlement.env}
            - {name: LAYERX_GUARANTOR_SETTLEMENT_FILE, value: /run/layerx/settlement/checkpoint-settlement.json}
            - {name: LAYERX_GUARANTOR_SETTLEMENT_DOMAIN, value: beta}
            - {name: LAYERX_GUARANTOR_LISTEN_PORT, value: "9451"}
            - {name: LAYERX_GUARANTOR_PEER_URL, value: "https://127.0.0.1:9452"}
            - {name: LAYERX_GUARANTOR_TLS_CA_FILE, value: /run/layerx/guarantor-tls/ca.crt}
            - {name: LAYERX_GUARANTOR_TLS_CERT_FILE, value: /run/layerx/guarantor-tls/tls.crt}
            - {name: LAYERX_GUARANTOR_TLS_KEY_FILE, value: /run/layerx/guarantor-tls/tls.key}
            - {name: LAYERX_GUARANTOR_SUBMITTER_KEY_FILE, value: /run/layerx/checkpoint-submitter/key}
            - {name: LAYERX_GUARANTOR_SUBMITTER_LOCK_FILE, value: /var/lib/guarantor-submitter/submitter.lock}
            - {name: LAYERX_GUARANTOR_PYTHON, value: /opt/layerx/guarantor/venv/bin/python3}
          ports: [{name: guarantor-1-tls, containerPort: 9451}]
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/guarantor, subPath: guarantor-1}
            - {name: run, mountPath: /run/layerx}
            - {name: settlement, mountPath: /run/layerx/settlement, readOnly: true}
            - {name: guarantor-1-tls, mountPath: /run/layerx/guarantor-tls, readOnly: true}
            - {name: checkpoint-submitter, mountPath: /run/layerx/checkpoint-submitter, readOnly: true}
            - {name: data, mountPath: /var/lib/guarantor-submitter, subPath: guarantor-submitter}
        - name: guarantor-2
          image: ghcr.io/sidiora-labs/layerx-node:0.1.0
          imagePullPolicy: Always
          command: [/opt/layerx/guarantor.sh]
          securityContext: {runAsUser: 4021, runAsGroup: 4020, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - {name: LAYERX_GUARANTOR_IDENTITY_DIR, value: /var/lib/guarantor/identity}
            - {name: LAYERX_GUARANTOR_STATE_DIR, value: /var/lib/guarantor/state}
            - {name: LAYERX_GUARANTOR_LNI_SOCKET, value: /run/layerx/node/layerxd.lni.sock}
            - {name: LAYERX_GUARANTOR_SETTLEMENT_ENV, value: /run/layerx/settlement/settlement.env}
            - {name: LAYERX_GUARANTOR_SETTLEMENT_FILE, value: /run/layerx/settlement/checkpoint-settlement.json}
            - {name: LAYERX_GUARANTOR_SETTLEMENT_DOMAIN, value: beta}
            - {name: LAYERX_GUARANTOR_LISTEN_PORT, value: "9452"}
            - {name: LAYERX_GUARANTOR_PEER_URL, value: "https://127.0.0.1:9451"}
            - {name: LAYERX_GUARANTOR_TLS_CA_FILE, value: /run/layerx/guarantor-tls/ca.crt}
            - {name: LAYERX_GUARANTOR_TLS_CERT_FILE, value: /run/layerx/guarantor-tls/tls.crt}
            - {name: LAYERX_GUARANTOR_TLS_KEY_FILE, value: /run/layerx/guarantor-tls/tls.key}
            - {name: LAYERX_GUARANTOR_SUBMITTER_KEY_FILE, value: /run/layerx/checkpoint-submitter/key}
            - {name: LAYERX_GUARANTOR_SUBMITTER_LOCK_FILE, value: /var/lib/guarantor-submitter/submitter.lock}
            - {name: LAYERX_GUARANTOR_PYTHON, value: /opt/layerx/guarantor/venv/bin/python3}
          ports: [{name: guarantor-2-tls, containerPort: 9452}]
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/guarantor, subPath: guarantor-2}
            - {name: run, mountPath: /run/layerx}
            - {name: settlement, mountPath: /run/layerx/settlement, readOnly: true}
            - {name: guarantor-2-tls, mountPath: /run/layerx/guarantor-tls, readOnly: true}
            - {name: checkpoint-submitter, mountPath: /run/layerx/checkpoint-submitter, readOnly: true}
            - {name: data, mountPath: /var/lib/guarantor-submitter, subPath: guarantor-submitter}
        - name: paxeer-relay
          image: ghcr.io/sidiora-labs/layerx-node:0.1.0
          imagePullPolicy: Always
          command: [/bin/sh, -ec]
          args:
            - |
              : "${LAYERX_NODE_PAXEER_RELAY_PORT:?relay port is required}"
              : "${LAYERX_NODE_PAXEER_BOUNDARY:?boundary host is required}"
              exec socat -T 120 "TCP4-LISTEN:${LAYERX_NODE_PAXEER_RELAY_PORT},bind=127.0.0.1,reuseaddr,fork" \
                "OPENSSL:${LAYERX_NODE_PAXEER_BOUNDARY}:9443,cafile=/run/layerx/trust/ca.crt,verify=1,commonname=${LAYERX_NODE_PAXEER_BOUNDARY}"
          env:
            - {name: LAYERX_NODE_PAXEER_RELAY_PORT, valueFrom: {configMapKeyRef: {name: layerx-node-config, key: paxeer-relay-port}}}
            - {name: LAYERX_NODE_PAXEER_BOUNDARY, value: paxeer-boundary.layerx-testnet.svc.cluster.local}
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: trust, mountPath: /run/layerx/trust, readOnly: true}
        - name: layerxd-authority
          image: ghcr.io/sidiora-labs/layerx-node:0.1.0
          imagePullPolicy: Always
          command: [/opt/layerx/supervisor.sh]
          args: [--role, replica, --data-dir, /var/lib/layerx/node, --run-dir, /run/layerx/node]
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/layerx}
            - {name: run, mountPath: /run/layerx}
            - {name: tmp, mountPath: /tmp}
        - name: core-boundary
          image: ghcr.io/sidiora-labs/layerx-core-boundary:0.1.0
          imagePullPolicy: Always
          command: [/bin/sh, -ec]
          args:
            - |
              while [ ! -r /run/layerx/node/core.env ]; do sleep 1; done
              set -a
              . /run/layerx/node/core.env
              set +a
              : "${LAYERX_CORE_SEQUENCER_ID:?generated sequencer identity is required}"
              : "${LAYERX_CORE_TREASURY_ASSET:?generated treasury asset is required}"
              exec /usr/local/bin/layerx-core-boundary
          securityContext: {runAsUser: 4021, runAsGroup: 4020, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - {name: LAYERX_CORE_LISTEN, value: "0.0.0.0:9443"}
            - {name: LAYERX_CORE_ADMIN_LISTEN, value: "0.0.0.0:9444"}
            - {name: LAYERX_CORE_NETWORK_ID, valueFrom: {configMapKeyRef: {name: layerx-node-config, key: network-id}}}
            - {name: LAYERX_CORE_TREASURY_ASSET, valueFrom: {configMapKeyRef: {name: layerx-node-config, key: asset-id}}}
            - {name: LAYERX_CORE_TLS_CERT_DER, value: /run/layerx/core-tls/server.crt.der}
            - {name: LAYERX_CORE_TLS_KEY_DER, value: /run/layerx/core-tls/server.key.der}
            - {name: LAYERX_CORE_ADMIN_TLS_CERT_DER, value: /run/layerx/core-admin-tls/server.crt.der}
            - {name: LAYERX_CORE_ADMIN_TLS_KEY_DER, value: /run/layerx/core-admin-tls/server.key.der}
            - {name: LAYERX_CORE_CLIENT_CA_DER, value: /run/layerx/trust/ca.crt.der}
            - {name: LAYERX_CORE_LNI_SOCKET, value: /run/layerx/node/layerxd.lni.sock}
            - {name: LAYERX_CORE_SUPERVISOR_SOCKET, value: /run/layerx/node/supervisor.sock}
            - {name: LAYERX_CORE_NODE_URL, value: "http://127.0.0.1:9401"}
            - {name: LAYERX_CORE_NODE_BEARER_TOKEN_FILE, value: /run/layerx/tokens/program-token}
            - {name: LAYERX_CORE_REPLICA_URL, value: "http://127.0.0.1:9402"}
            - {name: LAYERX_CORE_REPLICA_BEARER_TOKEN_FILE, value: /run/layerx/tokens/replica-token}
            - {name: LAYERX_CORE_ADMIN_TOKEN_FILE, value: /run/layerx/backend-admin/token}
            - {name: LAYERX_CORE_TREASURY_KEY_FILE, value: /run/layerx/keys/treasury.key}
            - {name: LAYERX_CORE_STATE_DIR, value: /var/lib/layerx/core}
          ports: [{name: core-tls, containerPort: 9443}, {name: core-admin-tls, containerPort: 9444}]
          readinessProbe: {httpGet: {scheme: HTTPS, path: /readyz, port: core-tls}, periodSeconds: 5}
          livenessProbe: {httpGet: {scheme: HTTPS, path: /livez, port: core-tls}, periodSeconds: 15}
          resources: {requests: {cpu: 250m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/layerx}
            - {name: run, mountPath: /run/layerx}
            - {name: keys, mountPath: /run/layerx/keys, readOnly: true}
            - {name: tokens, mountPath: /run/layerx/tokens, readOnly: true}
            - {name: backend-admin, mountPath: /run/layerx/backend-admin, readOnly: true}
            - {name: core-tls, mountPath: /run/layerx/core-tls, readOnly: true}
            - {name: core-admin-tls, mountPath: /run/layerx/core-admin-tls, readOnly: true}
            - {name: trust, mountPath: /run/layerx/trust, readOnly: true}
        - name: receipt-authority
          image: ghcr.io/sidiora-labs/layerx-receipt-authority:0.1.0
          imagePullPolicy: Always
          securityContext: {runAsUser: 4021, runAsGroup: 4020, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          command: [/bin/sh, -ec]
          args:
            - |
              while [ ! -r /run/layerx/node/core.env ]; do sleep 1; done
              set -a
              . /run/layerx/node/core.env
              set +a
              : "${LAYERX_CORE_SEQUENCER_ID:?generated sequencer identity is required}"
              export LAYERX_AUTHORITY_SEQUENCER_ID="$LAYERX_CORE_SEQUENCER_ID"
              export LAYERX_AUTHORITY_SEQUENCER_PUBLIC_KEY="$(tr -d '\r\n' < /run/layerx/gateway-authority/sequencer-public-key)"
              exec /usr/local/bin/layerx-receipt-authority
          env:
            - {name: LAYERX_AUTHORITY_LISTEN, value: "0.0.0.0:9445"}
            - {name: LAYERX_AUTHORITY_NETWORK_ID, valueFrom: {configMapKeyRef: {name: layerx-node-config, key: network-name}}}
            - {name: LAYERX_AUTHORITY_PROTOCOL_NETWORK_ID, valueFrom: {configMapKeyRef: {name: layerx-node-config, key: network-id}}}
            - {name: LAYERX_AUTHORITY_TLS_CERT_DER, value: /run/layerx/authority-tls/server.crt.der}
            - {name: LAYERX_AUTHORITY_TLS_KEY_DER, value: /run/layerx/authority-tls/server.key.der}
            - {name: LAYERX_AUTHORITY_CLIENT_CA_DER, value: /run/layerx/trust/ca.crt.der}
            - {name: LAYERX_AUTHORITY_HUMAN_AGENT_TOKEN_FILE, value: /run/authority-private/material/human-agent.token}
            - {name: LAYERX_AUTHORITY_HUMAN_AGENT_TENANT, valueFrom: {secretKeyRef: {name: layerx-human-authority-config, key: tenant}}}
            - {name: LAYERX_AUTHORITY_HUMAN_AGENT_PRINCIPAL, valueFrom: {secretKeyRef: {name: layerx-human-authority-config, key: principal}}}
            - {name: LAYERX_AUTHORITY_PRINCIPAL_POLICY_FILE, value: /run/authority-private/material/principal-policy.json}
            - {name: LAYERX_AUTHORITY_MODULE_REGISTRY_FILE, value: /run/authority-private/material/registry.json}
            - {name: LAYERX_AUTHORITY_CORE_CLOCK_HORIZON, valueFrom: {secretKeyRef: {name: layerx-human-authority-config, key: core-clock-horizon}}}
            - {name: LAYERX_AUTHORITY_STATE_ROOT, value: /var/lib/layerx/human/authority}
            - {name: LAYERX_AUTHORITY_TOKEN_FILES, value: /run/layerx/gateway-authority/token:/run/layerx/registry-authority/token:/run/layerx/webhooks-authority/token}
            - {name: LAYERX_AUTHORITY_REPLICA_URL, value: "http://127.0.0.1:9402"}
            - {name: LAYERX_AUTHORITY_REPLICA_BEARER_TOKEN_FILE, value: /run/layerx/tokens/replica-token}
            - {name: LAYERX_AUTHORITY_REPLICA_ID, valueFrom: {configMapKeyRef: {name: layerx-node-config, key: replica-id}}}
            - {name: LAYERX_AUTHORITY_LNI_SOCKET, value: /run/layerx/node/layerxd.lni.sock}
            - {name: LAYERX_AUTHORITY_FIRST_BATCH, value: "1"}
            - {name: LAYERX_AUTHORITY_LAST_BATCH, value: "18446744073709551615"}
          ports: [{name: authority-tls, containerPort: 9445}]
          readinessProbe: {httpGet: {scheme: HTTPS, path: /readyz, port: authority-tls}, periodSeconds: 5}
          livenessProbe: {httpGet: {scheme: HTTPS, path: /livez, port: authority-tls}, periodSeconds: 15}
          resources: {requests: {cpu: 200m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts:
            - {name: run, mountPath: /run/layerx}
            - {name: tokens, mountPath: /run/layerx/tokens, readOnly: true}
            - {name: authority-tls, mountPath: /run/layerx/authority-tls, readOnly: true}
            - {name: trust, mountPath: /run/layerx/trust, readOnly: true}
            - {name: gateway-authority, mountPath: /run/layerx/gateway-authority, readOnly: true}
            - {name: registry-authority, mountPath: /run/layerx/registry-authority, readOnly: true}
            - {name: webhooks-authority, mountPath: /run/layerx/webhooks-authority, readOnly: true}
            - {name: human-authority-private, mountPath: /run/authority-private, readOnly: true}
            - {name: human-state, mountPath: /var/lib/layerx/human/authority, subPath: authority}
        - name: agent-boundary
          image: ghcr.io/sidiora-labs/layerx-agent-boundary:0.1.0
          imagePullPolicy: Always
          securityContext: {runAsUser: 4021, runAsGroup: 4020, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - {name: LAYERX_AGENT_BOUNDARY_LISTEN, value: "0.0.0.0:9446"}
            - {name: LAYERX_AGENT_BOUNDARY_NETWORK_ID, valueFrom: {configMapKeyRef: {name: layerx-node-config, key: network-name}}}
            - {name: LAYERX_AGENT_BOUNDARY_PROTOCOL_NETWORK_ID, valueFrom: {configMapKeyRef: {name: layerx-node-config, key: network-id}}}
            - {name: LAYERX_AGENT_BOUNDARY_TLS_CERT_DER, value: /run/layerx/agent-tls/server.crt.der}
            - {name: LAYERX_AGENT_BOUNDARY_TLS_KEY_DER, value: /run/layerx/agent-tls/server.key.der}
            - {name: LAYERX_AGENT_BOUNDARY_CLIENT_CA_DER, value: /run/layerx/trust/ca.crt.der}
            - {name: LAYERX_AGENT_BOUNDARY_GATEWAY_TOKEN_FILE, value: /run/layerx/gateway-component/token}
            - {name: LAYERX_AGENT_BOUNDARY_WEBHOOK_TOKEN_FILE, value: /run/layerx/webhooks-component/token}
            - {name: LAYERX_AGENT_BOUNDARY_REGISTRY_TOKEN_FILE, value: /run/layerx/registry-component/token}
            - {name: LAYERX_AGENT_BOUNDARY_LNI_SOCKET, value: /run/layerx/node/layerxd.lni.sock}
            - {name: LAYERX_AGENT_BOUNDARY_NODE_URL, value: "http://127.0.0.1:9401"}
            - {name: LAYERX_AGENT_BOUNDARY_NODE_BEARER_TOKEN_FILE, value: /run/layerx/tokens/program-token}
            - {name: LAYERX_AGENT_BOUNDARY_STATE_DIR, value: /var/lib/layerx/agent-boundary}
          ports: [{name: agent-tls, containerPort: 9446}]
          readinessProbe: {httpGet: {scheme: HTTPS, path: /readyz, port: agent-tls}, periodSeconds: 5}
          livenessProbe: {httpGet: {scheme: HTTPS, path: /livez, port: agent-tls}, periodSeconds: 15}
          resources: {requests: {cpu: 250m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/layerx}
            - {name: run, mountPath: /run/layerx}
            - {name: tokens, mountPath: /run/layerx/tokens, readOnly: true}
            - {name: agent-tls, mountPath: /run/layerx/agent-tls, readOnly: true}
            - {name: trust, mountPath: /run/layerx/trust, readOnly: true}
            - {name: gateway-component, mountPath: /run/layerx/gateway-component, readOnly: true}
            - {name: webhooks-component, mountPath: /run/layerx/webhooks-component, readOnly: true}
            - {name: registry-component, mountPath: /run/layerx/registry-component, readOnly: true}
        - name: human
          image: ghcr.io/sidiora-labs/layerx-human:0.1.0
          imagePullPolicy: Always
          env:
            - name: LAYERX_HUMAN_BIND
              value: 0.0.0.0:9447
            - name: LAYERX_HUMAN_TLS_CERT_DER
              value: /run/layerx/tls/server.crt.der
            - name: LAYERX_HUMAN_TLS_KEY_DER
              value: /run/layerx/tls/server.key.der
            - name: LAYERX_HUMAN_COMPONENT_SOCKET
              value: /run/layerx/human/components.sock
            - name: LAYERX_HUMAN_WEB_ORIGIN
              value: https://human.testnet.layerx.network
          ports:
            - name: human-https
              containerPort: 9447
          readinessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - --show-error
                - --max-time
                - '5'
                - --cacert
                - /run/layerx/tls/ca.crt
                - https://localhost:9447/readyz
            timeoutSeconds: 6
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: human-https
              scheme: HTTPS
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsUser: 4020
            runAsGroup: 4020
          volumeMounts:
            - name: human-tls
              mountPath: /run/layerx/tls
              readOnly: true
            - name: run
              mountPath: /run/layerx/human
              subPath: human
          command:
            - /usr/local/bin/layerx-human-service
        - name: components
          image: ghcr.io/sidiora-labs/layerx-human:0.1.0
          imagePullPolicy: Always
          command:
            - /usr/local/bin/human-entrypoint
            - components
          envFrom:
            - secretRef:
                name: layerx-human-components-config
          env:
            - name: LAYERX_HUMAN_COMPONENT_SOCKET
              value: /run/layerx/human/components.sock
            - name: LAYERX_HUMAN_COMPONENT_ALLOWED_UID
              value: '4020'
            - name: LAYERX_HUMAN_COMPONENT_WORKERS
              value: '4'
            - name: LAYERX_HUMAN_COMPONENT_QUEUE_CAPACITY
              value: '4'
            - name: LAYERX_HUMAN_MAINTENANCE_INTERVAL_SECONDS
              value: '10'
            - name: LAYERX_HUMAN_MAINTENANCE_MAXIMUM_ITEMS
              value: '100'
            - name: LAYERX_HUMAN_STORE_ROOT
              value: /var/lib/layerx/human/store
            - name: LAYERX_HUMAN_CUSTODY_ROOT
              value: /var/lib/layerx/human/custody
            - name: LAYERX_HUMAN_AUTH_INDEX_ROOT
              value: /var/lib/layerx/human/auth-index
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsUser: 4020
            runAsGroup: 4020
          volumeMounts:
            - name: run
              mountPath: /run/layerx/human
              subPath: human
            - name: human-state
              mountPath: /var/lib/layerx/human
              subPath: components
            - name: human-components-material
              mountPath: /run/human-material
              readOnly: true
            - name: human-components-private
              mountPath: /run/human-private
        - name: human-identity
          image: ghcr.io/sidiora-labs/layerx-human:0.1.0
          imagePullPolicy: Always
          command:
            - /usr/local/bin/human-entrypoint
            - identity
          env:
            - name: LAYERX_HUMAN_IDENTITY_PROVIDER_SOCKET
              value: /run/layerx/human/identity.sock
            - name: LAYERX_HUMAN_IDENTITY_PROVIDER_STATE_ROOT
              value: /var/lib/layerx/human/identity
            - name: LAYERX_HUMAN_IDENTITY_PROVIDER_ALLOWED_UID
              value: '4020'
            - name: LAYERX_HUMAN_IDENTITY_PROVIDER_RECOVERY_POLICY_FILE
              value: /run/human-private/identity/recovery-policy.json
            - name: LAYERX_HUMAN_IDENTITY_PROVIDER_DEADLINE_SECONDS
              value: '5'
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            runAsUser: 4020
            runAsGroup: 4020
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: run
              mountPath: /run/layerx/human
              subPath: human
            - name: human-state
              mountPath: /var/lib/layerx/human
              subPath: identity
            - name: human-identity-private
              mountPath: /run/human-private
            - name: human-identity-material
              mountPath: /run/human-material
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/layerx-human-identity-provider
                - probe
            timeoutSeconds: 6
            periodSeconds: 10
        - name: human-security
          image: ghcr.io/sidiora-labs/layerx-human:0.1.0
          imagePullPolicy: Always
          command:
            - /usr/local/bin/human-entrypoint
            - security
          env:
            - name: LAYERX_HUMAN_SECURITY_PROVIDER_SOCKET
              value: /run/layerx/human/security.sock
            - name: LAYERX_HUMAN_SECURITY_PROVIDER_STATE_ROOT
              value: /var/lib/layerx/human/security
            - name: LAYERX_HUMAN_SECURITY_PROVIDER_ALLOWED_UID
              value: '4020'
            - name: LAYERX_HUMAN_SECURITY_PROVIDER_TRUST_HISTORY
              value: /run/human-private/security/trust-history
            - name: LAYERX_HUMAN_SECURITY_PROVIDER_DEADLINE_SECONDS
              value: '5'
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            runAsUser: 4020
            runAsGroup: 4020
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: run
              mountPath: /run/layerx/human
              subPath: human
            - name: human-state
              mountPath: /var/lib/layerx/human
              subPath: security
            - name: human-security-private
              mountPath: /run/human-private
            - name: human-security-material
              mountPath: /run/human-material
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/layerx-human-security-provider
                - probe
            timeoutSeconds: 6
            periodSeconds: 10
        - name: human-movement
          image: ghcr.io/sidiora-labs/layerx-human:0.1.0
          imagePullPolicy: Always
          command:
            - /usr/local/bin/human-entrypoint
            - movement
          envFrom:
            - secretRef: {name: layerx-human-movement-config}
          env:
            - name: LAYERX_HUMAN_MOVEMENT_PROVIDER_SOCKET
              value: /run/layerx/human/movement.sock
            - name: LAYERX_HUMAN_MOVEMENT_PROVIDER_STATE_ROOT
              value: /var/lib/layerx/human/movement
            - name: LAYERX_HUMAN_MOVEMENT_PROVIDER_ALLOWED_UID
              value: '4020'
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            runAsUser: 4020
            runAsGroup: 4020
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: run
              mountPath: /run/layerx/human
              subPath: human
            - name: human-state
              mountPath: /var/lib/layerx/human
              subPath: movement
            - name: human-movement-private
              mountPath: /run/human-private
            - name: human-movement-material
              mountPath: /run/human-material
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/layerx-human-movement-provider
                - probe
            timeoutSeconds: 6
            periodSeconds: 10
        - name: human-kms
          image: ghcr.io/sidiora-labs/layerx-human:0.1.0
          imagePullPolicy: Always
          command:
            - /usr/local/bin/human-entrypoint
            - kms
          env:
            - name: LAYERX_HUMAN_KMS_LISTEN
              value: 127.0.0.1:9450
            - name: LAYERX_HUMAN_KMS_STATE_DIR
              value: /var/lib/layerx/human/kms
            - name: LAYERX_HUMAN_KMS_PROVIDER_REFERENCE
              value: layerx-human-kms
            - name: LAYERX_HUMAN_KMS_REGISTRY_FILE
              value: /run/human-private/kms/registry.json
            - name: LAYERX_HUMAN_KMS_TLS_CERT_DER
              value: /run/human-private/kms/kms-server.der
            - name: LAYERX_HUMAN_KMS_TLS_KEY_DER
              value: /run/human-private/kms/kms-server-key.der
            - name: LAYERX_HUMAN_KMS_CLIENT_CA_DER
              value: /run/human-private/kms/ca.der
            - name: LAYERX_HUMAN_KMS_CLIENT_CERT_DER
              value: /run/human-private/kms/kms-client.der
            - name: LAYERX_HUMAN_KMS_EVM_CLIENT_CERT_DER
              value: /run/human-private/kms/kms-executor.der
            - name: LAYERX_HUMAN_KMS_SEAL_SECRET_FILE
              value: /run/human-private/kms/kms-seal
            - name: LAYERX_HUMAN_KMS_DEADLINE_SECONDS
              value: '10'
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            runAsUser: 4026
            runAsGroup: 4020
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: human-state
              mountPath: /var/lib/layerx/human
              subPath: kms
            - name: human-kms-private
              mountPath: /run/human-private
            - name: human-kms-material
              mountPath: /run/human-material
              readOnly: true
        - name: human-owner
          image: ghcr.io/sidiora-labs/layerx-human:0.1.0
          imagePullPolicy: Always
          command:
            - /usr/local/bin/human-entrypoint
            - agent
          env: []
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            runAsUser: 4021
            runAsGroup: 4020
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: run
              mountPath: /run/layerx
            - name: human-state
              mountPath: /var/lib/layerx/human
              subPath: agent
            - name: human-agent-private
              mountPath: /run/human-private
            - name: human-agent-material
              mountPath: /run/human-material
              readOnly: true
            - name: human-agent-journal
              mountPath: /run/human-journal
              readOnly: true
          envFrom:
            - secretRef:
                name: layerx-human-agent-config
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - exec curl --fail --silent --show-error --max-time 5 --config /run/human-private/agent/probe.conf http://127.0.0.1:9451/healthz
            timeoutSeconds: 6
            periodSeconds: 10
      volumes:
        - {name: human-authority-private, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
        - {name: human-module-registry, configMap: {name: layerx-core-module-registry}}
        - {name: human-identity-material, secret: {secretName: layerx-human-identity-material, defaultMode: 0440}}
        - {name: human-security-material, secret: {secretName: layerx-human-security-material, defaultMode: 0440}}
        - {name: human-movement-material, secret: {secretName: layerx-human-movement-material, defaultMode: 0440}}
        - name: human-authority
          secret:
            secretName: layerx-human-authority-material
            defaultMode: 0440
        - {name: human-state, persistentVolumeClaim: {claimName: layerx-human-state}}
        - {name: run, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
        - {name: keys, secret: {secretName: layerx-node-keys, defaultMode: 0440}}
        - {name: tokens, secret: {secretName: layerx-node-tokens, defaultMode: 0440}}
        - {name: settlement, configMap: {name: layerx-node-settlement, optional: true}}
        - {name: backend-admin, secret: {secretName: layerx-testnet-backend-admin}}
        - {name: trust, secret: {secretName: layerx-internal-ca}}
        - {name: core-tls, secret: {secretName: layerx-pending-core-tls}}
        - {name: core-admin-tls, secret: {secretName: layerx-pending-core-admin-tls}}
        - {name: authority-tls, secret: {secretName: layerx-receipt-authority-tls}}
        - {name: agent-tls, secret: {secretName: layerx-agent-boundary-tls}}
        - {name: gateway-authority, secret: {secretName: layerx-gateway-authority-client}}
        - {name: registry-authority, secret: {secretName: layerx-program-registry-authority-client}}
        - {name: webhooks-authority, secret: {secretName: layerx-webhooks-authority-client}}
        - {name: gateway-component, secret: {secretName: layerx-gateway-component-client}}
        - {name: webhooks-component, secret: {secretName: layerx-webhooks-component-client}}
        - {name: registry-component, secret: {secretName: layerx-program-registry-node-client}}
        - name: human-tls
          secret:
            secretName: layerx-human-tls
            defaultMode: 288
        - name: human-components-material
          secret:
            secretName: layerx-human-component-material
            defaultMode: 288
        - name: human-kms-material
          secret:
            secretName: layerx-human-kms-material
            defaultMode: 288
        - name: human-agent-material
          secret:
            secretName: layerx-human-agent-material
            defaultMode: 288
        - name: human-agent-journal
          secret:
            secretName: layerx-human-agent-journal
            defaultMode: 288
        - name: human-components-private
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: human-kms-private
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: human-agent-private
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: human-identity-private
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: human-security-private
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: human-movement-private
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 50Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: layerx-pending-core, namespace: layerx-testnet}
spec: {type: ClusterIP, selector: {app: layerx-node}, ports: [{name: https, port: 9443, targetPort: core-tls}]}
---
apiVersion: v1
kind: Service
metadata: {name: layerx-pending-core-admin, namespace: layerx-testnet}
spec: {type: ClusterIP, selector: {app: layerx-node}, ports: [{name: https, port: 9444, targetPort: core-admin-tls}]}
---
apiVersion: v1
kind: Service
metadata: {name: layerx-receipt-authority, namespace: layerx-testnet}
spec: {type: ClusterIP, selector: {app: layerx-node}, ports: [{name: https, port: 9443, targetPort: authority-tls}]}
---
apiVersion: v1
kind: Service
metadata: {name: layerx-agent-boundary, namespace: layerx-testnet}
spec: {type: ClusterIP, selector: {app: layerx-node}, ports: [{name: https, port: 9443, targetPort: agent-tls}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: layerx-node-ingress, namespace: layerx-testnet}
spec:
  podSelector: {matchLabels: {app: layerx-node}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: layerx-node}}}]
      ports: [{protocol: TCP, port: 9445}]
    - from: [{podSelector: {matchLabels: {app: layerx-testnet-control}}}]
      ports: [{protocol: TCP, port: 9443}, {protocol: TCP, port: 9444}, {protocol: TCP, port: 9445}]
    - from: [{podSelector: {matchLabels: {app: layerx-gateway}}}]
      ports: [{protocol: TCP, port: 9443}, {protocol: TCP, port: 9445}, {protocol: TCP, port: 9446}]
    - from: [{podSelector: {matchLabels: {app: layerx-program-registry}}}]
      ports: [{protocol: TCP, port: 9445}, {protocol: TCP, port: 9446}]
    - from: [{podSelector: {matchLabels: {app: layerx-faucet}}}]
      ports: [{protocol: TCP, port: 9443}]
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: layerx-developer}}, podSelector: {matchLabels: {app: layerx-webhooks}}}]
      ports: [{protocol: TCP, port: 9445}, {protocol: TCP, port: 9446}]
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: layerx-developer}}, podSelector: {matchLabels: {app: layerx-dashboard-api}}}]
      ports: [{protocol: TCP, port: 9445}, {protocol: TCP, port: 9446}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: layerx-node-egress, namespace: layerx-testnet}
spec:
  podSelector: {matchLabels: {app: layerx-node}}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{podSelector: {matchLabels: {app: paxeer}}}]
      ports: [{protocol: TCP, port: 9443}]
    - to: [{podSelector: {matchLabels: {app: paxeer}}}]
      ports: [{protocol: TCP, port: 9444}]
    - to: [{podSelector: {matchLabels: {app: layerx-node}}}]
      ports: [{protocol: TCP, port: 9445}]
