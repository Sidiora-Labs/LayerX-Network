[package]
name = "layerx-node-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
license = "LicenseRef-Centra-ai-Protocol"
publish = false

[[bin]]
name = "layerx-node-probe"
path = "src/main.rs"

[dependencies]
libc = "0.2"
layerx-client = { path = "../../../../../agent/crates/layerx-client" }
layerx-proof = { path = "../../../../../agent/crates/layerx-proof" }
layerx-types = { path = "../../../../../agent/crates/layerx-types" }
layerx-wire = { path = "../../../../../agent/crates/layerx-wire" }
layerx-platform-core = { path = "../../../core" }

[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
