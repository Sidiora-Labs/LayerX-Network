apiVersion: apps/v1
kind: StatefulSet
metadata: {name: layerx-program-registry, namespace: layerx-testnet}
spec:
  serviceName: layerx-program-registry
  replicas: 1
  selector: {matchLabels: {app: layerx-program-registry}}
  template:
    metadata: {labels: {app: layerx-program-registry, layerx-plane: trusted-boundary}}
    spec:
      nodeSelector: {layerx.io/program-registry-boundary: "v2"}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: layerx-node}}
              topologyKey: kubernetes.io/hostname
      securityContext: {runAsNonRoot: true, runAsUser: 4030, runAsGroup: 4030, fsGroup: 4030, fsGroupChangePolicy: OnRootMismatch}
      initContainers:
        - name: journal-directory
          image: ghcr.io/sidiora-labs/layerx-program-registry:0.1.0
          imagePullPolicy: Always
          command: [/bin/sh, -euc, 'umask 077 && mkdir -p /run/layerx/journal-volume/journal && chmod 0700 /run/layerx/journal-volume/journal && mkdir -p /run/layerx/state-volume/verified && chmod 0700 /run/layerx/state-volume/verified']
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: journal, mountPath: /run/layerx/journal-volume}
            - {name: state, mountPath: /run/layerx/state-volume}
        - name: trust-history
          image: ghcr.io/sidiora-labs/layerx-program-registry:0.1.0
          imagePullPolicy: Always
          command: [/bin/sh, -euc, 'umask 077 && cp /run/layerx/trust-source/history /run/layerx/trust/history && chmod 0600 /run/layerx/trust/history']
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: trust-source, mountPath: /run/layerx/trust-source, readOnly: true}
            - {name: trust, mountPath: /run/layerx/trust}
      containers:
        - name: registry
          image: ghcr.io/sidiora-labs/layerx-program-registry:0.1.0
          imagePullPolicy: Always
          args: [layerx-program-registry]
          ports: [{name: registry, containerPort: 9420}]
          env:
            - {name: LAYERX_EVENTS_PROGRAM_UPSTREAM_URL, value: "https://programs.layerx-internal.svc"}
            - {name: LAYERX_EVENTS_PROGRAM_UPSTREAM_CA_DER, value: "/run/layerx/events/ca.der"}
            - {name: LAYERX_EVENTS_PROGRAM_UPSTREAM_TOKEN_FILE, value: "/run/layerx/events/token"}
            - {name: LAYERX_EVENTS_PROGRAM_UPSTREAM_CLIENT_IDENTITY_PKCS12, value: "/run/layerx/events/client.p12"}
            - {name: LAYERX_EVENTS_PROGRAM_UPSTREAM_CLIENT_IDENTITY_PASSWORD_FILE, value: "/run/layerx/events/password"}
            - {name: LAYERX_EVENTS_WEBHOOKS_UPSTREAM_URL, value: "https://layerx-webhooks.layerx-developer.svc"}
            - {name: LAYERX_EVENTS_WEBHOOKS_UPSTREAM_CA_DER, value: "/run/layerx/events/ca.der"}
            - {name: LAYERX_EVENTS_WEBHOOKS_UPSTREAM_TOKEN_FILE, value: "/run/layerx/events/webhook-token"}
            - {name: LAYERX_EVENTS_WEBHOOKS_UPSTREAM_CLIENT_IDENTITY_PKCS12, value: "/run/layerx/events/client.p12"}
            - {name: LAYERX_EVENTS_WEBHOOKS_UPSTREAM_CLIENT_IDENTITY_PASSWORD_FILE, value: "/run/layerx/events/password"}
            - {name: LAYERX_REGISTRY_IDENTITY_URL, value: "https://identity.layerx-internal.svc"}
            - {name: LAYERX_REGISTRY_IDENTITY_CA_DER, value: "/run/layerx/events/ca.der"}
            - {name: LAYERX_REGISTRY_IDENTITY_TOKEN_FILE, value: "/run/layerx/events/identity-token"}
            - {name: LAYERX_REGISTRY_IDENTITY_CLIENT_IDENTITY_PKCS12, value: "/run/layerx/events/client.p12"}
            - {name: LAYERX_REGISTRY_IDENTITY_CLIENT_IDENTITY_PASSWORD_FILE, value: "/run/layerx/events/password"}
            - {name: LAYERX_REGISTRY_LISTEN, value: "0.0.0.0:9420"}
            - {name: LAYERX_REGISTRY_STATE, value: /var/lib/layerx-program-registry}
            - {name: LAYERX_REGISTRY_JOURNAL, value: /var/lib/layerx-registry-journal}
            - {name: LAYERX_REGISTRY_REQUEST_TOKEN_FILE, value: /run/layerx/request/token}
            - {name: LAYERX_REGISTRY_PUBLICATION_TOKEN_FILE, value: /run/layerx/publication/token}
            - {name: LAYERX_REGISTRY_TLS_CERT_DER, value: /run/layerx/server/tls.crt.der}
            - {name: LAYERX_REGISTRY_TLS_KEY_DER, value: /run/layerx/server/tls.key.der}
            - {name: LAYERX_REGISTRY_CLIENT_CA_DER, value: /run/layerx/client-ca/ca.crt.der}
            - {name: LAYERX_REGISTRY_BUILDER_ENVIRONMENT_ROOT, value: /opt/layerx-builder/rootfs}
            - {name: LAYERX_REGISTRY_BUILDER_ENTRYPOINT, value: /bin/layerx-build}
            - {name: LAYERX_REGISTRY_BUILDER_IMAGE_DIGEST, valueFrom: {configMapKeyRef: {name: layerx-program-builder-release, key: environment-tree-digest}}}
            - {name: LAYERX_REGISTRY_BUILDER_ISOLATION_RUNTIME, value: /usr/bin/bwrap}
            - {name: LAYERX_REGISTRY_BUILDER_ISOLATION_RUNTIME_DIGEST, valueFrom: {configMapKeyRef: {name: layerx-program-builder-release, key: bwrap-digest}}}
            - {name: LAYERX_REGISTRY_BUILDER_JOB_SUPERVISOR, value: /usr/bin/layerx-cgroup-exec}
            - {name: LAYERX_REGISTRY_BUILDER_JOB_SUPERVISOR_DIGEST, valueFrom: {configMapKeyRef: {name: layerx-program-builder-release, key: cgroup-exec-digest}}}
            - {name: LAYERX_REGISTRY_HOST_CGROUP_MOUNT, value: /run/layerx/host-cgroup}
            - {name: LAYERX_REGISTRY_BUILD_ROOT, value: /run/layerx/quota}
            - {name: LAYERX_REGISTRY_BUILD_MEMORY_BYTES, value: "2147483648"}
            - {name: LAYERX_REGISTRY_BUILD_PROCESS_LIMIT, value: "64"}
            - {name: LAYERX_REGISTRY_BUILD_FILE_SIZE_BYTES, value: "67108864"}
            - {name: LAYERX_REGISTRY_REQUEST_TIMEOUT_SECONDS, value: "1800"}
            - {name: LAYERX_REGISTRY_BUILD_TIMEOUT_SECONDS, value: "1800"}
            - {name: LAYERX_REGISTRY_MAX_CONNECTIONS, value: "128"}
            - {name: LAYERX_REGISTRY_MAX_BUILDS, value: "4"}
            - {name: LAYERX_REGISTRY_NODE_ENDPOINT, value: "https://layerx-agent-boundary.layerx-testnet.svc.cluster.local:9443"}
            - {name: LAYERX_REGISTRY_NODE_AUTHORIZATION, valueFrom: {secretKeyRef: {name: layerx-program-registry-node-client, key: token}}}
            - {name: LAYERX_REGISTRY_OUTBOUND_CA_DER, value: /run/layerx/client-ca/ca.crt.der}
            - {name: LAYERX_REGISTRY_RECEIPT_AUTHORITY_ENDPOINT, value: "https://layerx-receipt-authority.layerx-testnet.svc.cluster.local:9443"}
            - {name: LAYERX_REGISTRY_RECEIPT_AUTHORITY_AUTHORIZATION, valueFrom: {secretKeyRef: {name: layerx-program-registry-authority-client, key: token}}}
            - {name: LAYERX_REGISTRY_RECEIPT_AUTHORITY_REPLICA_ID, valueFrom: {configMapKeyRef: {name: layerx-receipt-authority, key: replica-id}}}
            - {name: LAYERX_REGISTRY_SEQUENCER_TRUST_HISTORY, value: /run/layerx/trust/history}
          # Controllers in the container root forbid new direct members: kubectl exec is refused by design.
          # The registry lives in main and delegates workers before dropping irrevocably to 4030.
          readinessProbe: {tcpSocket: {port: registry}, periodSeconds: 5, failureThreshold: 3}
          resources: {requests: {cpu: "1", memory: 1Gi}, limits: {cpu: "4", memory: 4Gi}}
          securityContext: {runAsUser: 0, runAsGroup: 0, runAsNonRoot: false, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL], add: [CHOWN, SETUID, SETGID]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: events, mountPath: /run/layerx/events, readOnly: true}
            - {name: state, mountPath: /var/lib/layerx-program-registry}
            - {name: journal, mountPath: /var/lib/layerx-registry-journal, subPath: journal}
            - {name: request, mountPath: /run/layerx/request/token, subPath: token, readOnly: true}
            - {name: publication, mountPath: /run/layerx/publication/token, subPath: token, readOnly: true}
            - {name: server, mountPath: /run/layerx/server/tls.crt.der, subPath: tls.crt.der, readOnly: true}
            - {name: server, mountPath: /run/layerx/server/tls.key.der, subPath: tls.key.der, readOnly: true}
            - {name: client-ca, mountPath: /run/layerx/client-ca, readOnly: true}
            - {name: trust, mountPath: /run/layerx/trust, readOnly: true}
            - {name: builder, mountPath: /opt/layerx-builder, readOnly: true}
            - {name: host-cgroup, mountPath: /run/layerx/host-cgroup, readOnly: false}
            - {name: quota, mountPath: /run/layerx/quota}
        - name: explorer-index
          image: ghcr.io/sidiora-labs/layerx-human:0.1.0
          imagePullPolicy: Always
          command: [/bin/sh, -ec]
          args:
            - |
              : "${LAYERX_EXPLORER_DEPLOYMENT_JOURNAL:?deployment journal is required}"
              : "${LAYERX_EXPLORER_OBSERVATION_DIR:?protocol observation directory is required}"
              until [ -s "$LAYERX_EXPLORER_DEPLOYMENT_JOURNAL/head" ] \
                  && ls "$LAYERX_EXPLORER_DEPLOYMENT_JOURNAL"/*.admission > /dev/null 2>&1 \
                  && [ -s "$LAYERX_EXPLORER_OBSERVATION_DIR/probe-program" ] \
                  && [ -s "$LAYERX_EXPLORER_OBSERVATION_DIR/naming-program" ] \
                  && [ -s "$LAYERX_EXPLORER_OBSERVATION_DIR/observed-sealed-batch" ] \
                  && [ -s "$LAYERX_EXPLORER_OBSERVATION_DIR/finalised-checkpoint" ]; do
                  sleep 5
              done
              LAYERX_EXPLORER_PROGRAM_PROBE_ID=$(tr -d '\r\n' < "$LAYERX_EXPLORER_OBSERVATION_DIR/probe-program")
              LAYERX_EXPLORER_OBSERVED_SEALED_BATCH=$(tr -d '\r\n' < "$LAYERX_EXPLORER_OBSERVATION_DIR/observed-sealed-batch")
              LAYERX_EXPLORER_FINALISED_CHECKPOINT=$(tr -d '\r\n' < "$LAYERX_EXPLORER_OBSERVATION_DIR/finalised-checkpoint")
              LAYERX_EXPLORER_NAMING_PROGRAM=$(tr -d '\r\n' < "$LAYERX_EXPLORER_OBSERVATION_DIR/naming-program")
              export LAYERX_EXPLORER_PROGRAM_PROBE_ID LAYERX_EXPLORER_OBSERVED_SEALED_BATCH LAYERX_EXPLORER_FINALISED_CHECKPOINT
              export LAYERX_EXPLORER_NAMING_PROGRAM
              exec /usr/local/bin/layerx-runtime-clock --runtime-dir /run/layerx/explorer-clock -- /usr/local/bin/layerx-explorer-index
          env:
            - {name: LAYERX_EXPLORER_OBSERVATION_DIR, value: /run/layerx/explorer-observation}
            - {name: LAYERX_EXPLORER_PROGRAM_LISTEN, value: "127.0.0.1:9457"}
            - {name: LAYERX_EXPLORER_PROGRAM_BEARER_TOKEN, valueFrom: {secretKeyRef: {name: layerx-explorer-index, key: program-token}}}
            - {name: LAYERX_EXPLORER_PROGRAM_MAX_STALENESS_MS, value: "300000"}
            - {name: LAYERX_EXPLORER_NODE_ENDPOINT, value: "https://layerx-agent-boundary.layerx-testnet.svc.cluster.local:9443"}
            - {name: LAYERX_EXPLORER_NODE_BEARER_TOKEN, valueFrom: {secretKeyRef: {name: layerx-program-registry-node-client, key: token}}}
            - {name: LAYERX_EXPLORER_AUTHORITY_ENDPOINT, value: "https://layerx-receipt-authority.layerx-testnet.svc.cluster.local:9443"}
            - {name: LAYERX_EXPLORER_AUTHORITY_BEARER_TOKEN, valueFrom: {secretKeyRef: {name: layerx-program-registry-authority-client, key: token}}}
            - {name: LAYERX_EXPLORER_AUTHORITY_CA_DER, value: /run/layerx/client-ca/ca.crt.der}
            - {name: LAYERX_EXPLORER_AUTHORITY_REPLICA_ID, valueFrom: {configMapKeyRef: {name: layerx-receipt-authority, key: replica-id}}}
            - {name: LAYERX_EXPLORER_SEQUENCER_TRUST_HISTORY, value: /run/layerx/trust/history}
            - {name: LAYERX_EXPLORER_DEPLOYMENT_JOURNAL, value: /var/lib/layerx-registry-journal}
            - {name: LAYERX_EXPLORER_VERIFIED_SOURCE_STORE, value: /var/lib/layerx-registry-verified}
            - {name: LAYERX_EXPLORER_READ_KEY_FILE, value: /run/layerx/explorer-read/read-key}
            - {name: LAYERX_EXPLORER_READ_ENDPOINT, value: "https://layerx-pending-core.layerx-testnet.svc.cluster.local:9443"}
            - {name: LAYERX_EXPLORER_READ_CA_DER, value: /run/layerx/client-ca/ca.crt.der}
            - {name: LAYERX_EXPLORER_READ_SEQUENCER_PUBLIC_KEY_FILE, value: /run/layerx/explorer-read/sequencer-public-key}
            - {name: LAYERX_EXPLORER_READ_NETWORK_ID, valueFrom: {configMapKeyRef: {name: layerx-node-config, key: network-id}}}
            - {name: LAYERX_EXPLORER_READ_FEE_LIMIT, value: "50000000"}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {runAsUser: 4030, runAsGroup: 4030, runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: journal, mountPath: /var/lib/layerx-registry-journal, subPath: journal, readOnly: true}
            - {name: state, mountPath: /var/lib/layerx-registry-verified, subPath: verified, readOnly: true}
            - {name: client-ca, mountPath: /run/layerx/client-ca, readOnly: true}
            - {name: trust, mountPath: /run/layerx/trust, readOnly: true}
            - {name: explorer-observation, mountPath: /run/layerx/explorer-observation, readOnly: true}
            - {name: explorer-read, mountPath: /run/layerx/explorer-read, readOnly: true}
            - {name: explorer-clock, mountPath: /run/layerx/explorer-clock}
        - name: explorer-boundary
          image: ghcr.io/sidiora-labs/layerx-node:0.1.0
          imagePullPolicy: Always
          command: [/bin/sh, -ec]
          args:
            - |
              : "${LAYERX_EXPLORER_BOUNDARY_PORT:?explorer boundary port is required}"
              : "${LAYERX_EXPLORER_PROGRAM_PORT:?explorer program port is required}"
              while ! socat -T 2 /dev/null "TCP:127.0.0.1:${LAYERX_EXPLORER_PROGRAM_PORT}" > /dev/null 2>&1; do sleep 5; done
              exec socat -T 30 \
                "OPENSSL-LISTEN:${LAYERX_EXPLORER_BOUNDARY_PORT},bind=0.0.0.0,reuseaddr,fork,cert=/run/layerx/explorer-tls/tls.crt,key=/run/layerx/explorer-tls/tls.key,verify=0" \
                "TCP:127.0.0.1:${LAYERX_EXPLORER_PROGRAM_PORT}"
          env:
            - {name: LAYERX_EXPLORER_BOUNDARY_PORT, value: "9443"}
            - {name: LAYERX_EXPLORER_PROGRAM_PORT, value: "9457"}
          ports: [{name: explorer-tls, containerPort: 9443}]
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}
          securityContext: {runAsUser: 4030, runAsGroup: 4030, runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: explorer-tls, mountPath: /run/layerx/explorer-tls, readOnly: true}
      volumes:
        - {name: journal, persistentVolumeClaim: {claimName: layerx-registry-journal}}
        - {name: events, secret: {secretName: layerx-registry-event-producer, defaultMode: 0440}}
        - {name: request, secret: {secretName: layerx-program-registry-request-client, defaultMode: 0440}}
        - {name: publication, secret: {secretName: layerx-program-registry-publication-operator, defaultMode: 0440}}
        - {name: server, secret: {secretName: layerx-program-registry-server-tls, defaultMode: 0440}}
        - {name: client-ca, secret: {secretName: layerx-internal-ca}}
        - {name: trust-source, secret: {secretName: layerx-sequencer-trust-history, defaultMode: 0440}}
        - {name: trust, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        - {name: builder, persistentVolumeClaim: {claimName: layerx-program-builder-release}}
        - {name: host-cgroup, hostPath: {path: /sys/fs/cgroup/kubelet.slice, type: Directory}}
        - {name: quota, hostPath: {path: /var/lib/layerx-program-registry-builds, type: Directory}}
        - {name: explorer-tls, secret: {secretName: layerx-explorer-index-tls, defaultMode: 0440}}
        - {name: explorer-observation, configMap: {name: layerx-explorer-index, optional: true, defaultMode: 0444}}
        - {name: explorer-read, secret: {secretName: layerx-explorer-index, defaultMode: 0440, items: [{key: read-key, path: read-key}, {key: sequencer-public-key, path: sequencer-public-key}]}}
        - {name: explorer-clock, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
  volumeClaimTemplates:
    - metadata: {name: state}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 100Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: layerx-program-registry, namespace: layerx-testnet}
spec: {selector: {app: layerx-program-registry}, ports: [{name: registry, port: 9420, targetPort: registry}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: layerx-program-registry, namespace: layerx-testnet}
spec:
  podSelector: {matchLabels: {app: layerx-program-registry}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: layerx-gateway}}}, {podSelector: {matchLabels: {app: layerx-testnet-control}}}]
      ports: [{protocol: TCP, port: 9420}]
    - from: [{podSelector: {matchLabels: {layerx-role: source-publication-operator}}}]
      ports: [{protocol: TCP, port: 9420}]
  egress:
    - to: [{podSelector: {matchLabels: {layerx-plane: trusted-boundary}}}]
      ports: [{protocol: TCP, port: 9443}, {protocol: TCP, port: 9445}, {protocol: TCP, port: 9446}]
    - to: [{namespaceSelector: {}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: v1
kind: Service
metadata: {name: layerx-explorer-index, namespace: layerx-testnet}
spec: {selector: {app: layerx-program-registry}, ports: [{name: explorer, port: 9443, targetPort: explorer-tls}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: layerx-explorer-index, namespace: layerx-testnet}
spec:
  podSelector: {matchLabels: {app: layerx-program-registry}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: layerx-human-web}}}]
      ports: [{protocol: TCP, port: 9443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: layerx-registry-lni-bridge, namespace: layerx-testnet}
spec:
  podSelector: {matchLabels: {app: layerx-node}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: layerx-program-registry}}}]
      ports: [{protocol: TCP, port: 9443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: layerx-registry-event-producer, namespace: layerx-testnet}
spec:
  podSelector: {matchLabels: {app: layerx-program-registry}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: layerx-internal}}
          podSelector: {matchExpressions: [{key: app, operator: In, values: [layerx-internal-programs]} ]}
      ports: [{protocol: TCP, port: 9443}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: layerx-developer}}
          podSelector: {matchLabels: {app: layerx-webhooks}}
      ports: [{protocol: TCP, port: 9444}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: layerx-testnet}}
          podSelector: {matchLabels: {app: layerx-identity}}
      ports: [{protocol: TCP, port: 9443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: registry-principal-identity, namespace: layerx-testnet}
spec:
  podSelector: {matchLabels: {app: layerx-identity}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: layerx-program-registry}}}]
      ports: [{protocol: TCP, port: 9443}]
