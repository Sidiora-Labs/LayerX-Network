services:
  node0:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: pax-node-0
    image: "pax-chain/localnode"
    user: "${USERID}:${GROUPID}"
    ports:
      - "26656-26658:26656-26658"
      - "9090-9091:9090-9091"
      - "8545-8546:8545-8546"
    environment:
      - ID=0
      - CLUSTER_SIZE=4
      - NUM_ACCOUNTS
      - SKIP_BUILD
      - INVARIANT_CHECK_INTERVAL
      - UPGRADE_VERSION_LIST
      - MOCK_BALANCES
      - GIGA_EXECUTOR
      - GIGA_OCC
      - RECEIPT_BACKEND
      - AUTOBAHN
      - GIGA_STORAGE
      - GIGA_MIGRATE_FROM_MEMIAVL
      - GIGA_FLATKV_ONLY
    volumes:
      - "${PROJECT_HOME}:/pax-protocol/pax-chain:Z"
      - "${GO_PKG_PATH}/mod:/root/go/pkg/mod:Z"
      - "${GOCACHE}:/root/.cache/go-build:Z"
    networks:
      localnet:
        ipv4_address: 192.168.10.10

  node1:
