- name: Staking validator should increase bonded tokens and staking pool
  inputs:
    - cmd: printf "12345678\n" | paxd keys show node_admin --bech val --output json | jq -r ".address"
      env: ADMIN_VAL_ADDR

    # State before staking
    - cmd: paxd q staking pool --output json | jq -r ".bonded_tokens"
      env: BEFORE_STAKING_POOL
    - cmd: paxd q staking validator $ADMIN_VAL_ADDR --output json | jq -r ".tokens"
      env: BEFORE_STAKED_TOKENS

    # staking tx
    - cmd: paxdbin=paxd; chainid=pax; source integration_test/utils/_tx_helpers.sh && submit_tx_and_wait admin staking delegate $ADMIN_VAL_ADDR 10pax --fees 2000uhpx
      env: DELEGATE_RESPONSE_CODE

    # state after staking
    - cmd: paxd q staking pool --output json | jq -r ".bonded_tokens"
      env: AFTER_STAKING_POOL
    - cmd: paxd q staking validator $ADMIN_VAL_ADDR --output json | jq -r ".tokens"
      env: AFTER_STAKED_TOKENS

  verifiers:
    - type: eval
      expr: DELEGATE_RESPONSE_CODE == 0
    # Pool should increase
    - type: eval
      expr: AFTER_STAKING_POOL > BEFORE_STAKING_POOL
    # Tokens should also increase
    - type: eval
      expr: BEFORE_STAKED_TOKENS < AFTER_STAKED_TOKENS

- name: Redelegating validator should increase and decrease accordingly
  inputs:
    - cmd: printf "12345678\n" | paxd keys show node_admin --bech val --output json | jq -r ".address"
      env: PAX_NODE_0_VAL_ADDR
    - cmd: printf "12345678\n" | paxd keys show node_admin --bech val --output json | jq -r ".address"
      env: PAX_NODE_1_VAL_ADDR
      node: pax-node-1

    # State before staking
    - cmd: paxd q staking pool --output json | jq -r ".bonded_tokens"
      env: BEFORE_STAKING_POOL
    - cmd: paxd q staking validator $PAX_NODE_0_VAL_ADDR --output json | jq -r ".tokens"
      env: PAX_NODE_0_BEFORE_STAKED_TOKENS
    - cmd: paxd q staking validator $PAX_NODE_1_VAL_ADDR --output json | jq -r ".tokens"
      env: PAX_NODE_1_BEFORE_STAKED_TOKENS

    # staking tx
    - cmd: paxdbin=paxd; chainid=pax; source integration_test/utils/_tx_helpers.sh && submit_tx_and_wait admin staking redelegate $PAX_NODE_0_VAL_ADDR $PAX_NODE_1_VAL_ADDR 10pax --fees 20000uhpx --gas 2000000
      env: REDELEGATE_RESPONSE_CODE

    # state after staking
    - cmd: paxd q staking pool --output json | jq -r ".bonded_tokens"
      env: AFTER_STAKING_POOL
    - cmd: paxd q staking validator $PAX_NODE_0_VAL_ADDR --output json | jq -r ".tokens"
      env: PAX_NODE_0_AFTER_STAKED_TOKENS
    - cmd: paxd q staking validator $PAX_NODE_1_VAL_ADDR --output json | jq -r ".tokens"
      env: PAX_NODE_1_AFTER_STAKED_TOKENS

  verifiers:
    - type: eval
      expr: REDELEGATE_RESPONSE_CODE == 0
    # Pool should not change
    - type: eval
      expr: AFTER_STAKING_POOL == BEFORE_STAKING_POOL

    # Before the redelegate node-0 has more than node-1
    - type: eval
      expr: PAX_NODE_0_BEFORE_STAKED_TOKENS > PAX_NODE_0_AFTER_STAKED_TOKENS and PAX_NODE_0_BEFORE_STAKED_TOKENS > PAX_NODE_1_BEFORE_STAKED_TOKENS
    # After the redelegate node-1 has more than node-0
    - type: eval
      expr: PAX_NODE_1_BEFORE_STAKED_TOKENS < PAX_NODE_1_AFTER_STAKED_TOKENS and PAX_NODE_1_AFTER_STAKED_TOKENS > PAX_NODE_0_AFTER_STAKED_TOKENS

- name: Unstaking validator should decrease bonded tokens and staking pool
  inputs:
    - cmd: printf "12345678\n" | paxd keys show node_admin --bech val --output json | jq -r ".address"
      env: PAX_NODE_1_VAL_ADDR
      node: pax-node-1

    # State before staking
    - cmd: paxd q staking pool --output json | jq -r ".bonded_tokens"
      env: BEFORE_STAKING_POOL
    - cmd: paxd q staking validator $PAX_NODE_1_VAL_ADDR --output json | jq -r ".tokens"
      env: BEFORE_STAKED_TOKENS

    - cmd: paxdbin=paxd; chainid=pax; source integration_test/utils/_tx_helpers.sh && submit_tx_and_wait admin staking unbond $PAX_NODE_1_VAL_ADDR 1pax --fees 2000uhpx
      env: DELEGATE_RESPONSE_CODE

    # state after staking
    - cmd: paxd q staking pool --output json | jq -r ".bonded_tokens"
      env: AFTER_STAKING_POOL
    - cmd: paxd q staking validator $PAX_NODE_1_VAL_ADDR --output json | jq -r ".tokens"
      env: AFTER_STAKED_TOKENS

  verifiers:
    - type: eval
      expr: DELEGATE_RESPONSE_CODE == 0
    # Pool should decrease
    - type: eval
      expr: AFTER_STAKING_POOL < BEFORE_STAKING_POOL
    # Tokens should also decrease
    - type: eval
      expr: BEFORE_STAKED_TOKENS > AFTER_STAKED_TOKENS
