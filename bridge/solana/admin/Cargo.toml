[package]
name = "paxeer-x-bridge-solana-admin"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "paxeer-x-bridge-solana-admin"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bincode = "1.3"
paxeer-x-bridge-solana-program = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account-decoder-client-types = "=2.3.13"
solana-commitment-config = "=2.2.1"
solana-loader-v3-interface = { version = "=5.0.0", features = ["serde"] }
solana-program = "=2.3.0"
solana-rpc-client = "=2.3.13"
solana-rpc-client-api = "=2.3.13"
solana-sdk = "=2.3.1"
solana-sdk-ids = "=2.2.1"
spl-token = { version = "=7.0.0", default-features = false, features = ["no-entrypoint"] }

[dev-dependencies]
solana-banks-interface = "=2.3.13"
solana-program-test = "=2.3.13"
solana-system-interface = "=1.0.0"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }

[lints.rust]
unsafe_code = "deny"
