site_name: Paxeer-LX-Network
site_description: Documentation for Paxeer-LX-Network — one network: the Paxeer EVM chain and the LayerX agent-native domain behind one interface.
site_url: https://sidiora-labs.github.io/LayerX-Network/
repo_url: https://github.com/Sidiora-Labs/LayerX-Network
repo_name: Sidiora-Labs/LayerX-Network
edit_uri: blob/main/docs/site/docs/
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Sidiora-Labs/LayerX-Network
nav:
  - Overview:
      - Home: index.md
      - Getting started: overview/getting-started.md
      - Testnet quickstart: overview/quickstart.md
