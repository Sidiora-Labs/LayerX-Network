name: paxeer-x-explorer

# Local, self-contained stack for the Paxeer X Network explorer.
#
# The four explorer services run the images the repository publishes from
# .github/workflows/explorer-images.yml, so what runs here is what a deployment
# runs. EXPLORER_IMAGE_TAG picks the tag: `latest` and `main` follow the main
# branch and `sha-<short commit>` pins one build.
#
#   EXPLORER_IMAGE_TAG=sha-abc1234 \
#   RPC_HTTP_URL=<your node http endpoint> \
#   RPC_WS_URL=<your node websocket endpoint> \
#     docker compose -f explorer/deploy/docker-compose.local.yml up
#
# The defaults below point at the Docker host gateway, so a node listening on
# the machine that runs Docker is reachable without any extra configuration.
#
# Four values have no sensible default and are taken from the host environment
# only; they are listed here rather than in env/*.example.env so that there is
# a single place to set them:
#
#   RPC_HTTP_URL     JSON-RPC HTTP endpoint of the node to index
#   RPC_WS_URL       JSON-RPC websocket endpoint of the same node
#   CHAIN_ID         EIP-155 chain id of that network
#   SECRET_KEY_BASE  Phoenix signing secret, at least 64 bytes;
#                    generate one with `openssl rand -base64 48`
#
# Leaving CHAIN_ID or SECRET_KEY_BASE empty is a hard startup error in the
# backend and the frontend; nothing here silently falls back to a stand-in.
#
# The `fixture` profile adds rpc-fixture, the recorded JSON-RPC server under
# tools/, in place of a node. It stays out of the stack unless the profile is
# named, so an ordinary run is unaffected. tools/tests/compose-smoke-test.sh
# brings the database, that server and the backend up under it and proves them.

x-rpc-http: &rpc-http ${RPC_HTTP_URL:-http://host.docker.internal:8545/}
x-rpc-ws: &rpc-ws ${RPC_WS_URL:-ws://host.docker.internal:8545/}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    shm_size: 256m
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - client_connection_check_interval=60000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blockscout}
      POSTGRES_USER: ${POSTGRES_USER:-blockscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blockscout}
    volumes:
      - explorer-db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-7432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-blockscout}" -d "${POSTGRES_DB:-blockscout}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rpc-fixture:
    profiles:
      - fixture
    image: python:3.12-alpine
    restart: unless-stopped
    command:
      - python3
      - /opt/rpc-fixture/rpc-fixture-server.py
    environment:
      RPC_FIXTURE_DIR: /opt/rpc-fixture/fixtures
      RPC_FIXTURE_HOST: 0.0.0.0
      RPC_FIXTURE_PORT: "8545"
    volumes:
      - ./tools/rpc-fixture-server.py:/opt/rpc-fixture/rpc-fixture-server.py:ro
      - ./tools/fixtures:/opt/rpc-fixture/fixtures:ro
    ports:
      - "${RPC_FIXTURE_PUBLISHED_PORT:-8545}:8545"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8545/__health').read()
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  smart-contract-verifier:
    image: ghcr.io/sidiora-labs/paxeer-x-explorer-smart-contract-verifier:${EXPLORER_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SMART_CONTRACT_VERIFIER__SERVER__HTTP__ENABLED: "true"
      SMART_CONTRACT_VERIFIER__SERVER__HTTP__ADDR: 0.0.0.0:8050
      SMART_CONTRACT_VERIFIER__SERVER__GRPC__ENABLED: "false"
      SMART_CONTRACT_VERIFIER__SOLIDITY__ENABLED: "true"
      SMART_CONTRACT_VERIFIER__SOLIDITY__COMPILERS_DIR: /tmp/solidity-compilers
      SMART_CONTRACT_VERIFIER__VYPER__ENABLED: "true"
      SMART_CONTRACT_VERIFIER__VYPER__COMPILERS_DIR: /tmp/vyper-compilers
      SMART_CONTRACT_VERIFIER__SOURCIFY__ENABLED: "false"
    volumes:
      - explorer-solc-compilers:/tmp/solidity-compilers
      - explorer-vyper-compilers:/tmp/vyper-compilers
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/localhost/8050'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  sig-provider:
    image: ghcr.io/sidiora-labs/paxeer-x-explorer-sig-provider:${EXPLORER_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SIG_PROVIDER__SERVER__HTTP__ENABLED: "true"
      SIG_PROVIDER__SERVER__HTTP__ADDR: 0.0.0.0:8050
      SIG_PROVIDER__SERVER__GRPC__ENABLED: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/localhost/8050'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: ghcr.io/sidiora-labs/paxeer-x-explorer-backend:${EXPLORER_IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 5m
    # The database has to be up before the release migrates it, and the
    # recorded JSON-RPC server before the release asks the node anything; the
    # server is only required when the `fixture` profile puts it in the stack.
    # The two microservices are reached over HTTP when a request needs them, so
    # they order nothing and are left out here - naming them would drag them
    # into a run that asked for the backend alone.
    depends_on:
      db:
        condition: service_healthy
      rpc-fixture:
        condition: service_healthy
        required: false
    command:
      - /bin/sh
      - -c
      - bin/blockscout eval 'Elixir.Explorer.ReleaseTasks.create_and_migrate()' && bin/blockscout start
    env_file:
      - ./env/backend.example.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-blockscout}:${POSTGRES_PASSWORD:-blockscout}@db:5432/${POSTGRES_DB:-blockscout}
      ETHEREUM_JSONRPC_HTTP_URL: *rpc-http
      ETHEREUM_JSONRPC_TRACE_URL: *rpc-http
      ETHEREUM_JSONRPC_ETH_CALL_URL: *rpc-http
      ETHEREUM_JSONRPC_WS_URL: *rpc-ws
      MICROSERVICE_SC_VERIFIER_URL: http://smart-contract-verifier:8050/
      MICROSERVICE_SIG_PROVIDER_URL: http://sig-provider:8050/
      CHAIN_ID: ${CHAIN_ID:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      PORT: "4000"
      # The settings a run may need to differ on. Each default repeats the
      # value env/backend.example.env declares, so leaving the variable unset
      # changes nothing.
      CHAIN_TYPE: ${CHAIN_TYPE:-paxeer_x}
      DISABLE_INDEXER: ${DISABLE_INDEXER:-false}
      MICROSERVICE_SC_VERIFIER_ENABLED: ${MICROSERVICE_SC_VERIFIER_ENABLED:-true}
      MICROSERVICE_SIG_PROVIDER_ENABLED: ${MICROSERVICE_SIG_PROVIDER_ENABLED:-true}
      PAXEER_X_CAPABILITIES_ENABLED: ${PAXEER_X_CAPABILITIES_ENABLED:-false}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${BACKEND_PUBLISHED_PORT:-4000}:4000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:4000/api/health/liveness > /dev/null
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  frontend:
    image: ghcr.io/sidiora-labs/paxeer-x-explorer-frontend:${EXPLORER_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./env/frontend.example.env
    environment:
      NEXT_PUBLIC_NETWORK_ID: ${CHAIN_ID:-}
      NEXT_PUBLIC_API_HOST: ${EXPLORER_PUBLIC_HOST:-localhost}
      NEXT_PUBLIC_API_PORT: ${BACKEND_PUBLISHED_PORT:-4000}
      NEXT_PUBLIC_APP_HOST: ${EXPLORER_PUBLIC_HOST:-localhost}
      NEXT_PUBLIC_APP_PORT: ${FRONTEND_PUBLISHED_PORT:-3000}
      PORT: "3000"
    ports:
      - "${FRONTEND_PUBLISHED_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:3000/api/healthz
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  explorer-db-data:
  explorer-solc-compilers:
  explorer-vyper-compilers:
