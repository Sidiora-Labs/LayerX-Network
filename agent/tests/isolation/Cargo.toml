[package]
name = "agent-isolation-suite"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
license = "Apache-2.0"
publish = false

[dependencies]
layerx-agentd = { path = "../../crates/layerx-agentd" }
layerx-mcp = { path = "../../crates/layerx-mcp" }
layerx-types = { path = "../../crates/layerx-types" }

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
