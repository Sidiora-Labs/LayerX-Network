[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "layerx-sdk"
version = "0.1.0"
description = "Production Python SDK for the LayerX Agent and Human APIs"
requires-python = ">=3.11"
license = { text = "See the LayerX repository LICENSE" }
authors = [{ name = "Sidiora Labs" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[tool.layerx-build]
contract-major = 1
source-date-epoch = 315532800

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
