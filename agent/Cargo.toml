[workspace]
members = [
    "crates/layerx-types",
    "crates/layerx-wire",
    "crates/layerx-crypto",
    "crates/layerx-proof",
    "crates/layerx-client",
    "crates/layerx-agent-api",
    "crates/layerx-agentd",
    "crates/layerx-mcp",
    "crates/layerx-sdk",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
