[package]
name = "layerx-agentd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
layerx-types = { path = "../layerx-types" }
layerx-client = { path = "../layerx-client" }
layerx-agent-api = { path = "../layerx-agent-api" }
layerx-crypto = { path = "../layerx-crypto" }
layerx-proof = { path = "../layerx-proof" }
layerx-wire = { path = "../layerx-wire" }
layerx-programs = { package = "layerx-programs-registry", path = "../../../programs/crates/layerx-programs-registry" }
layerx-programs-runtime = { path = "../../../programs/crates/layerx-programs-runtime" }
layerx-programs-protocol-adapter = { path = "../../../programs/crates/layerx-programs-protocol-adapter" }
sha2 = "=0.10.9"
serde_json = "=1.0.149"
ureq = { version = "=3.4.0", default-features = false, features = ["json", "native-tls-no-default"] }

[dev-dependencies]
ed25519-dalek = "=2.2.0"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"] }

[[test]]
name = "limits-exactly-once"
path = "../../tests/limits/exactly_once.rs"

[lints]
workspace = true
