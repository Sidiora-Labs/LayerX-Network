[package]
name = "layerx-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
layerx-types = { path = "../layerx-types" }
layerx-client = { path = "../layerx-client" }
layerx-agent-api = { path = "../layerx-agent-api" }
layerx-crypto = { path = "../layerx-crypto" }
layerx-proof = { path = "../layerx-proof" }
layerx-wire = { path = "../layerx-wire" }
layerx-mirror = { path = "../../../interop/crates/layerx-mirror" }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls-no-provider", "_ring"] }
rustls-native-certs = "=0.8.4"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
url = "=2.5.8"
tungstenite = { version = "=0.29.0", features = ["rustls-tls-native-roots"] }
zeroize = "=1.9.0"

[dev-dependencies]
ed25519-dalek = "=2.2.0"

[lints]
workspace = true
