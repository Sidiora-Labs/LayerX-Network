[package]
name = "layerx-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "layerx-mcp"
path = "src/bin/layerx-mcp.rs"

[dependencies]
layerx-sdk = { path = "../layerx-sdk" }
layerx-types = { path = "../layerx-types" }
layerx-agent-api = { path = "../layerx-agent-api" }
layerx-agentd = { path = "../layerx-agentd" }
layerx-crypto = { path = "../layerx-crypto" }
rustix = { version = "=1.1.4", features = ["net"] }
serde_json = "=1.0.149"
sha2 = "0.10"
zeroize = "=1.9.0"

[lints]
workspace = true

[[test]]
name = "injection"
path = "../../tests/mcp/injection.rs"
