[package]
name = "layerx-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "layerx-mcp"
path = "src/bin/layerx-mcp.rs"

[dependencies]
base64 = "=0.23.1"
layerx-sdk = { path = "../layerx-sdk" }
layerx-types = { path = "../layerx-types" }
layerx-agent-api = { path = "../layerx-agent-api" }
layerx-agentd = { path = "../layerx-agentd" }
layerx-crypto = { path = "../layerx-crypto" }
layerx-interop-gateway = { path = "../../../interop/crates/layerx-interop-gateway" }
layerx-proof = { path = "../layerx-proof" }
layerx-x402 = { path = "../../../interop/crates/layerx-x402" }
rustix = { version = "=1.1.4", features = ["net"] }
serde = "=1.0.229"
serde_json = "=1.0.149"
sha2 = "0.10"
sha3 = "=0.10.8"
zeroize = "=1.9.0"

[lints]
workspace = true

[[test]]
name = "injection"
path = "../../tests/mcp/injection.rs"
