      - '!scripts/PaxeerBetaDeploy.s.sol'
      - '!scripts/qualify-mirror-live.sh'
      - '!scripts/qualify-mirror-verification-live.sh'
      - '.github/workflows/paxeer-forge-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_CONFIG: foundry.paxeer.toml

defaults:
  run:
    working-directory: .

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          # Pin to stable for predictable CI. If tests fail after a Foundry update,
          # either fix compatibility or pin to a specific version (e.g., 1.5.1).
          # See:
          #  - https://github.com/foundry-rs/foundry/releases
          #  - https://github.com/foundry-rs/foundry-toolchain
          version: stable

      - name: Run Forge build
        run: |
          forge --version
          git clone --depth 1 --branch v1.9.6 https://github.com/foundry-rs/forge-std contracts/lib/forge-std
          git clone --depth 1 --branch v5.3.0 https://github.com/OpenZeppelin/openzeppelin-contracts contracts/lib/openzeppelin-contracts
          forge build --evm-version=prague
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv --evm-version=prague
        id: test
