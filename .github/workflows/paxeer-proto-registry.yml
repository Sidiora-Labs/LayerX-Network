name: Paxeer / Buf Push
# Protobuf runs buf (https://buf.build/) push updated proto files to https://buf.build/pax-protocol/pax-chain
# This workflow is only run when a .proto file has been changed
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'paxeer-network/api/**'
      - 'paxeer-network/buf.yaml'
      - '.github/workflows/paxeer-proto-registry.yml'

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: bufbuild/buf-setup-action@eb60cd0de4f14f1f57cf346916b8cd69a9e7ed0b # v1.26.1
      - uses: bufbuild/buf-push-action@a654ff18effe4641ebea4a4ce242c49800728459 # v1
        if: env.BUF_TOKEN != ''
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        with:
          input: paxeer-network
          buf_token: ${{ secrets.BUF_TOKEN }}
