name: Paxeer / Buf Push
# Protobuf runs buf (https://buf.build/) push updated proto files to https://buf.build/pax-protocol/pax-chain
# This workflow is only run when a .proto file has been changed
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'paxeer-network/api/**'
      - 'paxeer-network/buf.yaml'
      - '.github/workflows/paxeer-proto-registry.yml'

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-setup-action@v1.26.1
      - uses: bufbuild/buf-push-action@v1
        with:
          input: paxeer-network
          buf_token: ${{ secrets.BUF_TOKEN }}
