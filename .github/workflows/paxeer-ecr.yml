name: Paxeer / ECR

on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'chain.mk'
      - 'Dockerfile'
      - 'Dockerfile.dockerignore'
      - 'foundry.paxeer.toml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - 'buf.yaml'
      - 'codecov.yml'
      - 'config.yml'
      - '.golangci.yml'
      - 'gen.go'
      - 'link_directives_test.go'
      - 'mod_test.go'
      - 'run_blocktests.sh'
      - 'version.json'
      - 'admin/**'
      - 'api/**'
      - 'assets/**'
      - 'benchmark/**'
      - 'consensus/**'
      - 'custodyproof/**'
      - 'daemon/**'
      - 'docker/**'
      - 'engine/**'
      - 'example/**'
      - 'hpx/**'
      - 'integration_test/**'
      - 'interchain/**'
      - 'loadtest/**'
      - 'modules/**'
      - 'node/**'
      - 'occ_tests/**'
      - 'parallelization/**'
      - 'precompiles/**'
      - 'ratelimiter/**'
      - 'rpc/**'
      - 'sdk/**'
      - 'storage/**'
      - 'store/**'
      - 'sync/**'
      - 'testutil/**'
      - 'types/**'
      - 'utils/**'
      - 'wasm/**'
      - 'wasm-runtime/**'
      - 'wasmbinding/**'
      - 'contracts/src/**'
      - 'contracts/test/**'
      - 'contracts/scripts/**'
      - 'contracts/wasm/**'
      - 'docs/swagger/**'
      - 'docs/swagger-ui/**'
      - 'tests/chain/**'
      - 'tools/chain/**'
      - 'tools/tx-scanner/**'
      - 'tools/utils/**'
      - 'contracts/config/client.toml'
      - 'contracts/hardhat.config.js'
      - 'contracts/package.json'
      - 'contracts/package-lock.json'
      - 'contracts/tsconfig.json'
      - 'docs/evm_jsonrpc_unsupported.md'
      - 'docs/paxeer-network.md'
      - 'docs/paxeer-chain-docs.md'
      - 'scripts/**'
      - '!scripts/PaxeerBetaDeploy.s.sol'
      - '!scripts/qualify-mirror-live.sh'
      - '!scripts/qualify-mirror-verification-live.sh'
      - '.github/workflows/paxeer-ecr.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: '`pax-chain` git ref'
        required: true
        type: string
      tag:
        description: 'Tag'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publisher:
    name: Publish Container
    if: vars.AWS_ECR_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          role-duration-seconds: 900
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push paxd with mock balances
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/pax/build-cache:shared
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/pax/build-cache:shared,mode=max
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/pax/pax-chain:mock-${{ inputs.tag || inputs.ref || github.sha }}
          build-args: |
            PAX_CHAIN_REF=${{ inputs.ref || github.sha }}
            GO_BUILD_TAGS=mock_balances
      - name: Build and push paxd with mock block validation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/pax/build-cache:shared
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/pax/build-cache:shared,mode=max
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/pax/pax-chain:mock_block_validation-${{ inputs.tag || inputs.ref || github.sha }}
          build-args: |
            PAX_CHAIN_REF=${{ inputs.ref || github.sha }}
            GO_BUILD_TAGS=mock_block_validation
      - name: Build and push paxd with mock balances + mock chain validation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/pax/build-cache:shared
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/pax/build-cache:shared,mode=max
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/pax/pax-chain:mock_chain_validation-${{ inputs.tag || inputs.ref || github.sha }}
          build-args: |
            PAX_CHAIN_REF=${{ inputs.ref || github.sha }}
            GO_BUILD_TAGS=mock_balances mock_chain_validation
      - name: Build and push paxd
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/pax/build-cache:shared
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/pax/build-cache:shared,mode=max
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/pax/pax-chain:${{ inputs.tag || inputs.ref || github.sha }}
          build-args: |
            PAX_CHAIN_REF=${{ inputs.ref || github.sha }}
