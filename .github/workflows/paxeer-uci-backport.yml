name: Paxeer / UCI Backport
run-name: Paxeer / UCI / Backport

on:
  pull_request_target:
    types:
      - closed
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'chain.mk'
      - 'Dockerfile'
      - 'Dockerfile.dockerignore'
      - 'foundry.paxeer.toml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - 'buf.yaml'
      - 'codecov.yml'
      - 'config.yml'
      - '.golangci.yml'
      - 'gen.go'
      - 'link_directives_test.go'
      - 'mod_test.go'
      - 'run_blocktests.sh'
      - 'version.json'
      - 'admin/**'
      - 'api/**'
      - 'assets/**'
      - 'benchmark/**'
      - 'consensus/**'
      - 'custodyproof/**'
      - 'daemon/**'
      - 'docker/**'
      - 'engine/**'
      - 'example/**'
      - 'hpx/**'
      - 'integration_test/**'
      - 'interchain/**'
      - 'loadtest/**'
      - 'modules/**'
      - 'node/**'
      - 'occ_tests/**'
      - 'parallelization/**'
      - 'paxeer-docs/**'
      - 'precompiles/**'
      - 'ratelimiter/**'
      - 'rpc/**'
      - 'sdk/**'
      - 'storage/**'
      - 'store/**'
      - 'sync/**'
      - 'testutil/**'
      - 'types/**'
      - 'utils/**'
      - 'wasm/**'
      - 'wasm-runtime/**'
      - 'wasmbinding/**'
      - 'contracts/src/**'
      - 'contracts/test/**'
      - 'contracts/scripts/**'
      - 'contracts/wasm/**'
      - 'docs/swagger/**'
      - 'docs/swagger-ui/**'
      - 'tests/chain/**'
      - 'tools/chain/**'
      - 'tools/tx-scanner/**'
      - 'tools/utils/**'
      - 'contracts/config/client.toml'
      - 'contracts/hardhat.config.js'
      - 'contracts/package.json'
      - 'contracts/package-lock.json'
      - 'contracts/tsconfig.json'
      - 'docs/evm_jsonrpc_unsupported.md'
      - 'docs/paxeer-network.md'
      - 'docs/paxeer-chain-docs.md'
      - 'scripts/**'
      - '!scripts/PaxeerBetaDeploy.s.sol'
      - '!scripts/qualify-mirror-live.sh'
      - '!scripts/qualify-mirror-verification-live.sh'
      - '.github/workflows/paxeer-uci-backport.yml'
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  scope:
    name: Confirm Paxeer scope
    runs-on: ubuntu-latest
    outputs:
      paxeer: ${{ steps.files.outputs.paxeer }}
    steps:
      - id: files
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pull_number = context.issue.number;
            if (!pull_number) {
              core.setOutput('paxeer', 'false');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
              per_page: 100,
            });
            const chainFiles = ['go.mod', 'go.sum', 'chain.mk', 'Dockerfile', 'Dockerfile.dockerignore', 'foundry.paxeer.toml', 'buf.gen.yaml', 'buf.lock', 'buf.yaml', 'codecov.yml', 'config.yml', '.golangci.yml', 'gen.go', 'link_directives_test.go', 'mod_test.go', 'run_blocktests.sh', 'version.json', 'contracts/config/client.toml', 'contracts/hardhat.config.js', 'contracts/package.json', 'contracts/package-lock.json', 'contracts/tsconfig.json', 'docs/evm_jsonrpc_unsupported.md', 'docs/paxeer-network.md', 'docs/paxeer-chain-docs.md'];
            const chainPrefixes = ['admin/', 'api/', 'assets/', 'benchmark/', 'consensus/', 'custodyproof/', 'daemon/', 'docker/', 'engine/', 'example/', 'hpx/', 'integration_test/', 'interchain/', 'loadtest/', 'modules/', 'node/', 'occ_tests/', 'parallelization/', 'paxeer-docs/', 'precompiles/', 'ratelimiter/', 'rpc/', 'sdk/', 'storage/', 'store/', 'sync/', 'testutil/', 'types/', 'utils/', 'wasm/', 'wasm-runtime/', 'wasmbinding/', 'contracts/src/', 'contracts/test/', 'contracts/scripts/', 'contracts/wasm/', 'docs/swagger/', 'docs/swagger-ui/', 'tests/chain/', 'tools/chain/', 'tools/tx-scanner/', 'tools/utils/'];
            const layerxScripts = ['scripts/PaxeerBetaDeploy.s.sol', 'scripts/qualify-mirror-live.sh', 'scripts/qualify-mirror-verification-live.sh'];
            const inScope = files.some(({ filename }) =>
              chainFiles.includes(filename) ||
              chainPrefixes.some((prefix) => filename.startsWith(prefix)) ||
              (filename.startsWith('scripts/') && !layerxScripts.includes(filename)) ||
              filename === '.github/workflows/paxeer-uci-backport.yml'
            );
            core.setOutput('paxeer', String(inScope));
  backport:
    name: Backport
    needs: scope
    if: needs.scope.outputs.paxeer == 'true'
    uses: Paxeer-Network/pax-uci/.github/workflows/backport.yml@5acbd8eef65336b0619b46de3bfddfe84841a7fb # v0.0.9
    secrets: inherit
    with:
      backport-team: 'Paxeer-Network/pax-core'
