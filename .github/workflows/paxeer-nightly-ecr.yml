name: Paxeer / Nightly ECR

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-ecr
  cancel-in-progress: false

jobs:
  publish:
    name: Publish nightly containers
    if: vars.AWS_ECR_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout main HEAD
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Compute tag components
        id: tag
        run: |
          SHA=$(git rev-parse HEAD)
          SHA7=$(git rev-parse --short=7 HEAD)
          DATE=$(date -u +%Y%m%d)
          echo "sha=${SHA}"     >> "$GITHUB_OUTPUT"
          echo "sha7=${SHA7}"   >> "$GITHUB_OUTPUT"
          echo "date=${DATE}"   >> "$GITHUB_OUTPUT"
          echo "nightly=nightly-${DATE}-${SHA7}"   >> "$GITHUB_OUTPUT"
          echo "mock=mock-nightly-${DATE}-${SHA7}" >> "$GITHUB_OUTPUT"
          echo "mock_chain=mock_chain_validation-nightly-${DATE}-${SHA7}" >> "$GITHUB_OUTPUT"

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          role-duration-seconds: 7200

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Regular build -- consumed by release-test PAXD_IMAGE.
      - name: Build and push nightly (regular)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: paxeer-network
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/pax/pax-chain:${{ steps.tag.outputs.nightly }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/pax/build-cache:nightly-regular
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/pax/build-cache:nightly-regular,mode=max
          build-args: |
            PAX_CHAIN_REF=${{ steps.tag.outputs.sha }}

      # mock_balances -- consumed by nightly-load PAXD_IMAGE (pre-funded EVM accounts).
      - name: Build and push mock-nightly (mock_balances)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: paxeer-network
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/pax/pax-chain:${{ steps.tag.outputs.mock }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/pax/build-cache:nightly-mock
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/pax/build-cache:nightly-mock,mode=max
          build-args: |
            PAX_CHAIN_REF=${{ steps.tag.outputs.sha }}
            GO_BUILD_TAGS=mock_balances

      # mock_chain_validation -- consumed by chaos-lab forked-state replays;
      # swallows every swallow-eligible halting validation failure.
      - name: Build and push mock_chain_validation-nightly (mock_balances + mock_chain_validation)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: paxeer-network
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/pax/pax-chain:${{ steps.tag.outputs.mock_chain }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/pax/build-cache:nightly-mock-chain
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/pax/build-cache:nightly-mock-chain,mode=max
          build-args: |
            PAX_CHAIN_REF=${{ steps.tag.outputs.sha }}
            GO_BUILD_TAGS=mock_balances mock_chain_validation

      - name: Summary
        run: |
          echo "### Nightly ECR publish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | Variant |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.tag.outputs.nightly }}\` | regular |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.tag.outputs.mock }}\` | mock_balances |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.tag.outputs.mock_chain }}\` | mock_balances + mock_chain_validation |" >> "$GITHUB_STEP_SUMMARY"
