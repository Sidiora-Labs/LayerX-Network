name: Human workspace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: human/apps/web/package-lock.json
      - name: Install pinned Rust toolchain and policy auditor
        run: >-
          rustup toolchain install 1.91.1 --profile minimal --component clippy &&
          cargo install cargo-deny --locked --version 0.19.0
      - name: Install pinned Foundry toolchain
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - name: Install locked Human web dependencies
        run: make human-js-install
      - name: Enforce component-library integrity, copy, policies, and strict lints
        run: make human-check-ui human-lint human-check
      - name: Build and test the isolated human workspace
        run: make human-build human-test human-test-intents
      - name: Scan the web bundle for payload-encoding code paths
        run: >-
          cargo run --manifest-path human/tools/boundary-check/Cargo.toml
          --locked -- --web-bundle human/apps/web/.next

  browser-real-stack:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HUMAN_E2E_BASE_URL: ${{ vars.HUMAN_E2E_BASE_URL }}
      HUMAN_E2E_REAL_STACK: "1"
      HUMAN_VISUAL_BASELINE_REVIEWED: ${{ vars.HUMAN_VISUAL_BASELINE_REVIEWED }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: human/apps/web/package-lock.json
      - name: Install browser harness
        run: >-
          npm --prefix human/apps/web ci &&
          npm --prefix human/apps/web exec playwright install --with-deps chromium
      - name: Run merge browser suite
        if: github.event_name == 'push'
        run: make human-test-e2e
      - name: Run scheduled repeated browser suite
        if: github.event_name == 'schedule'
        run: make human-test-e2e-long

  browser-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: human/apps/web/package-lock.json
      - name: Install pinned Chromium
        run: >-
          npm --prefix human/apps/web ci &&
          npm --prefix human/apps/web exec playwright install --with-deps chromium
      - name: Enforce route and browser performance budgets
        run: make human-e2e-perf

  intent-fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned fuzz toolchain and runner
        run: >-
          rustup toolchain install nightly-2025-11-10 --profile minimal &&
          cargo install cargo-fuzz --locked
      - name: Fuzz intent parsing and compilation from the committed corpus
        run: make human-fuzz-intents
