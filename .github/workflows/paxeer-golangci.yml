name: Paxeer / golangci-lint
on:
  push:
    tags:
      - 'paxeer-network/v*'
    branches:
      - main
      - release/**
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'chain.mk'
      - 'Dockerfile'
      - 'Dockerfile.dockerignore'
      - 'foundry.paxeer.toml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - 'buf.yaml'
      - 'codecov.yml'
      - 'config.yml'
      - '.golangci.yml'
      - 'gen.go'
      - 'link_directives_test.go'
      - 'mod_test.go'
      - 'run_blocktests.sh'
      - 'version.json'
      - 'admin/**'
      - 'api/**'
      - 'assets/**'
      - 'benchmark/**'
      - 'consensus/**'
      - 'custodyproof/**'
      - 'daemon/**'
      - 'docker/**'
      - 'engine/**'
      - 'example/**'
      - 'hpx/**'
      - 'integration_test/**'
      - 'interchain/**'
      - 'loadtest/**'
      - 'modules/**'
      - 'node/**'
      - 'occ_tests/**'
      - 'parallelization/**'
      - 'precompiles/**'
      - 'ratelimiter/**'
      - 'rpc/**'
      - 'sdk/**'
      - 'storage/**'
      - 'store/**'
      - 'sync/**'
      - 'testutil/**'
      - 'types/**'
      - 'utils/**'
      - 'wasm/**'
      - 'wasm-runtime/**'
      - 'wasmbinding/**'
      - 'contracts/src/**'
      - 'contracts/test/**'
      - 'contracts/scripts/**'
      - 'contracts/wasm/**'
      - 'docs/swagger/**'
      - 'docs/swagger-ui/**'
      - 'tests/chain/**'
      - 'tools/chain/**'
      - 'tools/tx-scanner/**'
      - 'tools/utils/**'
      - 'contracts/config/client.toml'
      - 'contracts/hardhat.config.js'
      - 'contracts/package.json'
      - 'contracts/package-lock.json'
      - 'contracts/tsconfig.json'
      - 'docs/evm_jsonrpc_unsupported.md'
      - 'docs/paxeer-network.md'
      - 'docs/paxeer-chain-docs.md'
      - 'scripts/**'
      - '!scripts/PaxeerBetaDeploy.s.sol'
      - '!scripts/qualify-mirror-live.sh'
      - '!scripts/qualify-mirror-verification-live.sh'
      - '.github/workflows/paxeer-golangci.yml'
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'chain.mk'
      - 'Dockerfile'
      - 'Dockerfile.dockerignore'
      - 'foundry.paxeer.toml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - 'buf.yaml'
      - 'codecov.yml'
      - 'config.yml'
      - '.golangci.yml'
      - 'gen.go'
      - 'link_directives_test.go'
      - 'mod_test.go'
      - 'run_blocktests.sh'
      - 'version.json'
      - 'admin/**'
      - 'api/**'
      - 'assets/**'
      - 'benchmark/**'
      - 'consensus/**'
      - 'custodyproof/**'
      - 'daemon/**'
      - 'docker/**'
      - 'engine/**'
      - 'example/**'
      - 'hpx/**'
      - 'integration_test/**'
      - 'interchain/**'
      - 'loadtest/**'
      - 'modules/**'
      - 'node/**'
      - 'occ_tests/**'
      - 'parallelization/**'
      - 'precompiles/**'
      - 'ratelimiter/**'
      - 'rpc/**'
      - 'sdk/**'
      - 'storage/**'
      - 'store/**'
      - 'sync/**'
      - 'testutil/**'
      - 'types/**'
      - 'utils/**'
      - 'wasm/**'
      - 'wasm-runtime/**'
      - 'wasmbinding/**'
      - 'contracts/src/**'
      - 'contracts/test/**'
      - 'contracts/scripts/**'
      - 'contracts/wasm/**'
      - 'docs/swagger/**'
      - 'docs/swagger-ui/**'
      - 'tests/chain/**'
      - 'tools/chain/**'
      - 'tools/tx-scanner/**'
      - 'tools/utils/**'
      - 'contracts/config/client.toml'
      - 'contracts/hardhat.config.js'
      - 'contracts/package.json'
      - 'contracts/package-lock.json'
      - 'contracts/tsconfig.json'
      - 'docs/evm_jsonrpc_unsupported.md'
      - 'docs/paxeer-network.md'
      - 'docs/paxeer-chain-docs.md'
      - 'scripts/**'
      - '!scripts/PaxeerBetaDeploy.s.sol'
      - '!scripts/qualify-mirror-live.sh'
      - '!scripts/qualify-mirror-verification-live.sh'
      - '.github/workflows/paxeer-golangci.yml'
  merge_group:
permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.6'
          cache-dependency-path: go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.8.0
          args: --timeout 10m0s
          working-directory: .
