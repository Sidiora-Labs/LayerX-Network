concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
 run:
  shell: bash
  working-directory: .

env:
  TOTAL_RUNNERS: 5

jobs:
  runner-indexes:
    runs-on: ubuntu-latest
    name: Generate runner indexes
    defaults:
      run:
        working-directory: .
    outputs:
      json: ${{ steps.generate-index-list.outputs.json }}
    steps:
      - id: generate-index-list
        run: |
          MAX_INDEX=$((${{ env.TOTAL_RUNNERS }}-1))
          INDEX_LIST=$(seq 0 ${MAX_INDEX})
          INDEX_JSON=$(jq --null-input --compact-output '. |= [inputs]' <<< ${INDEX_LIST})
          echo "json=${INDEX_JSON}" >> $GITHUB_OUTPUT

  eth-blocktests:
    name: "Run ETH Blocktests ${{ matrix.runner-index }}"
    runs-on: ubuntu-latest
    needs: runner-indexes
    strategy:
      fail-fast: false
      matrix:
        # generate runner index array from 0 to total-runners
        runner-index: ${{fromJson(needs.runner-indexes.outputs.json)}}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.6'
          cache-dependency-path: go.sum

      - name: Clone ETH Blocktests
        run: |
          git clone https://github.com/ethereum/tests.git ethtests
          cd ethtests
          git checkout c67e485ff8b5be9abc8ad15345ec21aa22e290d9

      - name: Prepare isolated Pax home
        id: pax-home
        run: |
          runner_temp=$(realpath -e "${RUNNER_TEMP:?RUNNER_TEMP is required}")
          case "$runner_temp" in
            "$HOME"/*) ;;
            *) echo "RUNNER_TEMP must resolve below HOME" >&2; exit 1 ;;
          esac
          pax_home=$(mktemp -d "$runner_temp/pax-blocktests-${{ matrix.runner-index }}-XXXXXX")
          pax_home=$(realpath -e "$pax_home")
          case "$pax_home" in
            "$runner_temp"/*) ;;
            *) echo "Pax home must resolve below RUNNER_TEMP" >&2; exit 1 ;;
          esac
          echo "path=$pax_home" >> "$GITHUB_OUTPUT"

      - name: "Run ETH Blocktest"
        env:
          PAX_CI_TEMP_ROOT: ${{ runner.temp }}
          PAX_HOME: ${{ steps.pax-home.outputs.path }}
          PAX_LOCAL_RESET: '1'
        run: ./run_blocktests.sh ./ethtests/BlockchainTests/ ${{ matrix.runner-index }} ${{ env.TOTAL_RUNNERS }}

      - name: Remove isolated Pax home
        if: ${{ always() && steps.pax-home.outputs.path != '' }}
        env:
          PAX_HOME: ${{ steps.pax-home.outputs.path }}
        run: |
          runner_temp=$(realpath -e "${RUNNER_TEMP:?RUNNER_TEMP is required}")
          case "$runner_temp" in
            "$HOME"/*) ;;
            *) echo "RUNNER_TEMP must resolve below HOME" >&2; exit 1 ;;
          esac
          pax_home=$(realpath -m "$PAX_HOME")
          case "$pax_home" in
            "$runner_temp"/pax-blocktests-${{ matrix.runner-index }}-*) rm -rf -- "$pax_home" ;;
            *) echo "Refusing to remove Pax home outside the runner-owned blocktest directory" >&2; exit 1 ;;
          esac
