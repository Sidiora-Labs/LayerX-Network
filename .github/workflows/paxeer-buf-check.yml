name: Paxeer / Buf
on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
    paths:
      - 'paxeer-network/**'
      - '.github/workflows/paxeer-buf-check.yml'
  merge_group:
permissions:
  contents: read
  pull-requests: write
jobs:
  buf:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.58.0
          input: paxeer-network
