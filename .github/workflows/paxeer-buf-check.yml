name: Paxeer / Buf
on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'chain.mk'
      - 'Dockerfile'
      - 'Dockerfile.dockerignore'
      - 'foundry.paxeer.toml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - 'buf.yaml'
      - 'codecov.yml'
      - 'config.yml'
      - '.golangci.yml'
      - 'gen.go'
      - 'link_directives_test.go'
      - 'mod_test.go'
      - 'run_blocktests.sh'
      - 'version.json'
      - 'admin/**'
      - 'api/**'
      - 'assets/**'
      - 'benchmark/**'
      - 'consensus/**'
      - 'custodyproof/**'
      - 'daemon/**'
      - 'docker/**'
      - 'engine/**'
      - 'example/**'
      - 'hpx/**'
      - 'integration_test/**'
      - 'interchain/**'
      - 'loadtest/**'
      - 'modules/**'
      - 'node/**'
      - 'occ_tests/**'
      - 'parallelization/**'
      - 'precompiles/**'
      - 'ratelimiter/**'
      - 'rpc/**'
      - 'sdk/**'
      - 'storage/**'
      - 'store/**'
      - 'sync/**'
      - 'testutil/**'
      - 'types/**'
      - 'utils/**'
      - 'wasm/**'
      - 'wasm-runtime/**'
      - 'wasmbinding/**'
      - 'contracts/src/**'
      - 'contracts/test/**'
      - 'contracts/scripts/**'
      - 'contracts/wasm/**'
      - 'docs/swagger/**'
      - 'docs/swagger-ui/**'
      - 'tests/chain/**'
      - 'tools/chain/**'
      - 'tools/tx-scanner/**'
      - 'tools/utils/**'
      - 'contracts/config/client.toml'
      - 'contracts/hardhat.config.js'
      - 'contracts/package.json'
      - 'contracts/package-lock.json'
      - 'contracts/tsconfig.json'
      - 'docs/evm_jsonrpc_unsupported.md'
      - 'docs/paxeer-network.md'
      - 'docs/paxeer-chain-docs.md'
      - 'scripts/**'
      - '!scripts/PaxeerBetaDeploy.s.sol'
      - '!scripts/qualify-mirror-live.sh'
      - '!scripts/qualify-mirror-verification-live.sh'
      - '.github/workflows/paxeer-buf-check.yml'
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  buf:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: 1.58.0
          input: .
