name: Agent workspace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --component clippy
      - name: Build, lint, enforce boundaries, and test
        run: make agent-build agent-lint agent-check agent-test
      - name: Audit advisories, licenses, sources, and bans
        run: cargo install cargo-deny --locked --version 0.19.0 && cargo deny --manifest-path agent/Cargo.toml check

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned fuzz toolchain and runner
        run: >-
          rustup toolchain install nightly-2025-11-10 --profile minimal &&
          cargo install cargo-fuzz --locked
      - name: Run bounded codec fuzz smoke suite
        run: make agent-fuzz-wire

  adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and fuzz runner
        run: >-
          rustup toolchain install 1.91.1 --profile minimal &&
          rustup toolchain install nightly-2025-11-10 --profile minimal &&
          cargo install cargo-fuzz --locked
      - name: Run sanitizer variants
        run: make agent-test-sanitize
      - name: Run committed fuzz corpus
        run: make agent-fuzz-long
