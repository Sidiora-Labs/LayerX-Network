name: Paxeer / Cross-Architecture Build Test

on:
  pull_request:
    paths:
      - 'paxeer-network/**'
      - '.github/workflows/paxeer-cross-arch-build.yml'
  merge_group:
  push:
    branches:
      - main
      - release/**
    paths:
      - 'paxeer-network/**'
      - '.github/workflows/paxeer-cross-arch-build.yml'

defaults:
  run:
    working-directory: paxeer-network

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}

env:
  LEDGER_ENABLED: false

jobs:
  linux-amd64:
    name: "Linux AMD64"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.6'
          cache-dependency-path: paxeer-network/go.sum

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Verify Go installation
        run: |
          go version
          echo "GOARCH: $(go env GOARCH)"
          echo "GOOS: $(go env GOOS)"

      - name: Download Go dependencies
        run: go mod download

      - name: Run make install
        run: make install

      - name: Verify install binary
        run: paxd version --long

      - name: Run make build
        run: make build

      - name: Verify build binary
        run: ./build/paxd version --long
  macos-arm64:
    name: "macOS ARM64"
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.6'
          cache-dependency-path: paxeer-network/go.sum

      - name: Install system dependencies
        run: |
          xcode-select --version || xcode-select --install

      - name: Verify Go installation
        run: |
          go version
          echo "GOARCH: $(go env GOARCH)"
          echo "GOOS: $(go env GOOS)"

      - name: Download Go dependencies
        run: go mod download

      - name: Run make install
        run: make install

      - name: Verify install binary
        run: paxd version --long

      - name: Run make build
        run: make build

      - name: Verify build binary
        run: ./build/paxd version --long
