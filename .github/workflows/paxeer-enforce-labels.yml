name: Paxeer / Enforce PR Labels

on:
  pull_request:
    types: [labeled, unlabeled, opened, edited, synchronize]
    paths:
      - 'paxeer-network/**'
      - '.github/workflows/paxeer-enforce-labels.yml'
jobs:
  enforce-label:
    runs-on: ubuntu-latest
    steps:
    - uses: yogevbd/enforce-label-action@8d1e1709b1011e6d90400a0e6cf7c0b77aa5efeb # 2.1.0
      with:
        REQUIRED_LABELS_ANY: "app-hash-breaking,non-app-hash-breaking"
        REQUIRED_LABELS_ANY_DESCRIPTION: "Select at least one label ['app-hash-breaking', 'non-app-hash-breaking']"
