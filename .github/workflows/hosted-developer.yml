name: hosted-developer-surfaces

on:
  pull_request:
    paths:
      - "platform/hosted/webhooks/**"
      - "platform/hosted/dashboard/**"
      - ".github/workflows/hosted-developer.yml"
  push:
    branches: [main]
    paths:
      - "platform/hosted/webhooks/**"
      - "platform/hosted/dashboard/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.91.1 }
      - run: cargo test --manifest-path platform/Cargo.toml --locked -p layerx-platform-webhooks -p layerx-platform-dashboard
  owner-ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.6.0 }
      - run: make developer-dashboard-install developer-dashboard-static-test developer-dashboard-build
  deployment-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - run: kubectl apply --dry-run=client -f platform/hosted/webhooks/deployment.yaml
