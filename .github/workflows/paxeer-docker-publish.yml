name: Paxeer / Create and Push Docker Image

on:
  push:
    tags:
    - 'paxeer-network/v[0-9]+.[0-9]+.[0-9]+' # ignore rc

defaults:
  run:
    working-directory: paxeer-network

jobs:
  pax-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      -
        name: Check out the repo
        uses: actions/checkout@v5
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Parse tag
        id: tag
        run: |
          VERSION=${GITHUB_REF_NAME#paxeer-network/v}
          MAJOR_VERSION=$(echo $VERSION | cut -d '.' -f 1)
          MINOR_VERSION=$(echo $VERSION | cut -d '.' -f 2)
          PATCH_VERSION=$(echo $VERSION | cut -d '.' -f 3)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "MAJOR_VERSION=$MAJOR_VERSION" >> $GITHUB_ENV
          echo "MINOR_VERSION=$MINOR_VERSION" >> $GITHUB_ENV
          echo "PATCH_VERSION=$PATCH_VERSION" >> $GITHUB_ENV
      -
        name: Build and push
        id: build_push_image
        uses: docker/build-push-action@v6
        with:
          file: paxeer-network/Dockerfile
          context: paxeer-network
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PAX_CHAIN_REF=${{ github.sha }}
          tags: |
            ghcr.io/paxeer-network/pax:${{ env.MAJOR_VERSION }}
            ghcr.io/paxeer-network/pax:${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}
            ghcr.io/paxeer-network/pax:${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ env.PATCH_VERSION }}
            ghcr.io/paxeer-network/pax:v${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ env.PATCH_VERSION }}
      -
        name: Make Image Public
        env:
          GH_TOKEN: ${{ secrets.DOCKER_IMAGES }}
        run: |
          gh api -X PATCH "https://api.github.com/orgs/Paxeer-Network/packages/container/pax" --field visibility=public
