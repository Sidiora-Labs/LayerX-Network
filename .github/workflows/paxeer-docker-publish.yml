name: Paxeer / Create and Push Docker Image

on:
  push:
    tags:
    - 'paxeer-network/v[0-9]+.[0-9]+.[0-9]+' # ignore rc

defaults:
  run:
    working-directory: paxeer-network

jobs:
  pax-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      -
        name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Parse tag
        id: tag
        run: |
          VERSION=${GITHUB_REF_NAME#paxeer-network/v}
          MAJOR_VERSION=$(echo $VERSION | cut -d '.' -f 1)
          MINOR_VERSION=$(echo $VERSION | cut -d '.' -f 2)
          PATCH_VERSION=$(echo $VERSION | cut -d '.' -f 3)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "MAJOR_VERSION=$MAJOR_VERSION" >> $GITHUB_ENV
          echo "MINOR_VERSION=$MINOR_VERSION" >> $GITHUB_ENV
          echo "PATCH_VERSION=$PATCH_VERSION" >> $GITHUB_ENV
      -
        name: Build and push
        id: build_push_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: paxeer-network/Dockerfile
          context: paxeer-network
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PAX_CHAIN_REF=${{ github.sha }}
          tags: |
            ghcr.io/paxeer-network/pax:${{ env.MAJOR_VERSION }}
            ghcr.io/paxeer-network/pax:${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}
            ghcr.io/paxeer-network/pax:${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ env.PATCH_VERSION }}
            ghcr.io/paxeer-network/pax:v${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ env.PATCH_VERSION }}
      -
        name: Make Image Public
        env:
          GH_TOKEN: ${{ secrets.DOCKER_IMAGES }}
        run: |
          gh api -X PATCH "https://api.github.com/orgs/Paxeer-Network/packages/container/pax" --field visibility=public
