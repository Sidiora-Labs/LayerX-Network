name: Programs Conformance

on:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "src/modules/programs/**"
      - "src/protocol/**"
      - "src/state/**"
      - "include/layerx/programs.h"
      - "include/layerx/lxp_*.h"
      - "tests/programs/**"
      - "tests/protocol/**"
      - "tests/state/**"
      - "tests/test_snapshot.c"
      - "Makefile"
      - ".github/workflows/programs-conformance.yml"
  pull_request:
    paths:
      - "programs/**"
      - "src/modules/programs/**"
      - "src/protocol/**"
      - "src/state/**"
      - "include/layerx/programs.h"
      - "include/layerx/lxp_*.h"
      - "tests/programs/**"
      - "tests/protocol/**"
      - "tests/state/**"
      - "tests/test_snapshot.c"
      - "Makefile"
      - ".github/workflows/programs-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: programs-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Aggregate Programs acceptance gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          build-essential clang libssl-dev libsqlite3-dev ripgrep
      - name: Install pinned Rust toolchain with the wasm target
        run: >-
          rustup toolchain install 1.91.1 --profile minimal --no-self-update
          --target wasm32-unknown-unknown && rustup default 1.91.1
      - name: Install Node.js for the AssemblyScript SDK
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: Install locked AssemblyScript dependencies
        run: make programs-js-install
      - name: Run the aggregate Programs acceptance suite
        run: make programs-test

  fuzz-smoke:
    name: Bounded committed-corpus fuzz gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --no-self-update
      - name: Run validation instantiation and execution fuzz targets
        run: make programs-fuzz-smoke PROGRAMS_CARGO="cargo +1.91.1"

  differential-replay:
    name: Differential and versioned-replay gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --no-self-update
      - name: Run differential and versioned-replay gates
        run: make programs-differential PROGRAMS_CARGO="cargo +1.91.1"

  deterministic-execution:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 debug
            os: ubuntu-24.04
            cargo_args: ""
          - name: Linux x86_64 release
            os: ubuntu-24.04
            cargo_args: --release
          - name: Linux arm64 release
            os: ubuntu-24.04-arm
            cargo_args: --release
          - name: macOS arm64 release
            os: macos-14
            cargo_args: --release
          - name: Windows x86_64 release
            os: windows-2022
            cargo_args: --release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --no-self-update
      - name: Run deterministic execution vectors
        run: >-
          cargo +1.91.1 test --manifest-path programs/Cargo.toml --locked
          -p layerx-programs-runtime --test determinism ${{ matrix.cargo_args }}
