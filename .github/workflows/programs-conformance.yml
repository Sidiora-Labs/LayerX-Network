name: Programs Conformance

on:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "src/modules/programs/**"
      - "src/protocol/**"
      - "src/state/**"
      - "include/layerx/programs.h"
      - "include/layerx/lxp_*.h"
      - "tests/programs/**"
      - "tests/protocol/**"
      - "tests/state/**"
      - "tests/test_snapshot.c"
      - "Makefile"
      - ".github/workflows/programs-conformance.yml"
  pull_request:
    paths:
      - "programs/**"
      - "src/modules/programs/**"
      - "src/protocol/**"
      - "src/state/**"
      - "include/layerx/programs.h"
      - "include/layerx/lxp_*.h"
      - "tests/programs/**"
      - "tests/protocol/**"
      - "tests/state/**"
      - "tests/test_snapshot.c"
      - "Makefile"
      - ".github/workflows/programs-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: programs-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-smoke:
    name: Bounded committed-corpus fuzz gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --no-self-update
      - name: Run validation instantiation and execution fuzz targets
        run: make programs-fuzz-smoke PROGRAMS_CARGO="cargo +1.91.1"

  deterministic-execution:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 debug
            os: ubuntu-24.04
            cargo_args: ""
          - name: Linux x86_64 release
            os: ubuntu-24.04
            cargo_args: --release
          - name: Linux arm64 release
            os: ubuntu-24.04-arm
            cargo_args: --release
          - name: macOS arm64 release
            os: macos-14
            cargo_args: --release
          - name: Windows x86_64 release
            os: windows-2022
            cargo_args: --release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --no-self-update
      - name: Run deterministic execution vectors
        run: >-
          cargo +1.91.1 test --manifest-path programs/Cargo.toml --locked
          -p layerx-programs-runtime --test determinism ${{ matrix.cargo_args }}
