name: Explorer / Build

on:
  pull_request:
    paths:
      - 'explorer/**'
      - '.github/workflows/explorer-build.yml'

permissions:
  contents: read

concurrency:
  group: explorer-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  explorer-backend:
    name: Explorer backend build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: hexpm/elixir:1.19.4-erlang-27.3.4.6-alpine-3.22.2
    env:
      MIX_ENV: prod
      MIX_HOME: /opt/mix
    steps:
      - name: Install build dependencies
        run: |
          apk --no-cache --update add \
            alpine-sdk gmp-dev automake libtool inotify-tools autoconf python3 \
            file gcompat libstdc++ curl ca-certificates git make bash
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Hex and rebar
        run: mix local.hex --force && mix local.rebar --force
      - name: Build backend
        working-directory: explorer/backend
        run: mix deps.get && mix compile

  explorer-frontend:
    name: Explorer frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HUSKY: 0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: explorer/frontend/.nvmrc
      - name: Build frontend
        working-directory: explorer/frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

  explorer-services:
    name: Explorer service build (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        service: [smart-contract-verifier, sig-provider]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.6'
          cache: false
      - name: Install protoc plugins
        run: |
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@v2.18.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Check service
        working-directory: explorer/services/${{ matrix.service }}
        run: cargo check --all-targets

  explorer-lint:
    name: Explorer lint (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        leg: [backend, frontend, services]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        if: matrix.leg == 'frontend'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: explorer/frontend/.nvmrc
      - name: Enable Corepack
        if: matrix.leg == 'frontend'
        run: corepack enable
      - name: Set up Go
        if: matrix.leg == 'services'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.6'
          cache: false
      - name: Set up Rust
        if: matrix.leg == 'services'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Lint the explorer ${{ matrix.leg }}
        env:
          LEG: ${{ matrix.leg }}
        run: |
          "tools/explorer/lint-$LEG.sh"

  explorer-test-ratio:
    name: Explorer test ratio
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the test ratio over the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: tools/explorer/test-ratio.sh "$BASE_SHA...$HEAD_SHA"
