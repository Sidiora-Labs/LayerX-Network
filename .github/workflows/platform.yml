name: Platform workspace

on:
  schedule:
    - cron: "17 4 * * 2"
  push:
    branches: [main]
    tags: ["sdk-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js for middleware conformance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust toolchain and policy auditor
        run: >-
          rustup toolchain install 1.91.1 --profile minimal --component clippy &&
          cargo install cargo-deny --locked --version 0.19.0
      - name: Install pinned Swift toolchain
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.0.3"
      - name: Install locked platform JavaScript dependencies
        run: make platform-js-install
      - name: Fetch locked platform workspace crates
        run: cargo fetch --locked --manifest-path platform/Cargo.toml
      - name: Install platform sample and policy dependencies
        run: make platform-dependencies-install
      - name: Enforce workspace, dependency, license and audit policies
        run: make platform-lint
      - name: Build the platform workspace and run its drift and release gates
        run: make platform-build
      - name: Test the platform workspace
        run: make platform-test
      - name: Run Go and JVM conformance and compile Swift and C sharp SDKs
        run: make platform-verify-sdks
      - name: Exercise the developer CLI end to end against the emulator
        run: make platform-test-tooling
      - name: Build the framework integrations and scan client bundles for secrets
        run: make platform-test-middleware
      - name: Gate the four cloneable reference application launch profiles
        run: make platform-test-reference-apps
      - name: Build the documentation site and gate its executable samples
        run: make platform-test-docs

  android-application-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "8.7"
      - name: Install pinned Swift toolchain
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.0.3"
      - name: Install pinned Rust toolchain and policy auditor
        run: >-
          rustup toolchain install 1.91.1 --profile minimal &&
          cargo install cargo-deny --locked --version 0.19.0
      - name: Install platform sample and policy dependencies
        run: make platform-dependencies-install
      - name: Prime the Gradle cache under dependency verification
        run: make platform-prime-android-dependencies
      - name: Build the Android application and scan the APK for embedded secrets
        run: make platform-test-android-artifact

  ios-application-artifact:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the project generator
        run: brew install xcodegen
      - name: Build the iOS application and scan the app bundle for embedded secrets
        run: |
          cd platform/integrations/ios/sample-app
          xcodegen generate
          cd "$GITHUB_WORKSPACE"
          xcodebuild -project platform/integrations/ios/sample-app/LayerXWallet.xcodeproj \
            -scheme LayerXWallet -configuration Release -sdk iphonesimulator \
            -derivedDataPath platform/integrations/ios/.derived CODE_SIGNING_ALLOWED=NO build
          swift run --package-path platform/integrations/ios layerx-ios-secret-scan \
            platform/integrations/ios/.derived/Build/Products/Release-iphonesimulator/LayerXWallet.app

  real-agent-framework-journeys:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [mcp, a2a, openai, anthropic, langchain, vercel-ai]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - name: Build the production SDK, middleware and framework package
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build --workspace @sidiora/layerx-sdk
          npm run build --workspace @sidiora/layerx-seller-middleware
          npm run build --workspace @sidiora/layerx-agent-middleware
          npm run build --workspace @sidiora/layerx-agent-integrations
      - name: Fetch a fresh signed webhook delivery from the real service
        env:
          LAYERX_WEBHOOK_FIXTURE_URL: ${{ vars.LAYERX_SCHEDULED_WEBHOOK_FIXTURE_URL }}
          LAYERX_WEBHOOK_FIXTURE_TOKEN: ${{ secrets.LAYERX_SCHEDULED_WEBHOOK_FIXTURE_TOKEN }}
        run: |
          test -n "$LAYERX_WEBHOOK_FIXTURE_URL"
          test -n "$LAYERX_WEBHOOK_FIXTURE_TOKEN"
          umask 077
          curl --silent --show-error --fail --proto '=https' --tlsv1.3 --max-time 30 \
            --header "authorization: Bearer $LAYERX_WEBHOOK_FIXTURE_TOKEN" \
            "$LAYERX_WEBHOOK_FIXTURE_URL" \
            --output "$RUNNER_TEMP/layerx-webhook-delivery.json"
          test -s "$RUNNER_TEMP/layerx-webhook-delivery.json"
      - name: Execute the framework through the real LayerX service stack
        env:
          LAYERX_AGENT_FRAMEWORK: ${{ matrix.framework }}
          LAYERX_AGENT_RPC_URL: ${{ vars.LAYERX_SCHEDULED_AGENT_RPC_URL }}
          LAYERX_BUDGET_SERVICE_URL: ${{ vars.LAYERX_SCHEDULED_BUDGET_SERVICE_URL }}
          LAYERX_SIGNER_SERVICE_URL: ${{ vars.LAYERX_SCHEDULED_SIGNER_SERVICE_URL }}
          LAYERX_RECEIPT_SERVICE_URL: ${{ vars.LAYERX_SCHEDULED_RECEIPT_SERVICE_URL }}
          LAYERX_A2A_URL: ${{ vars.LAYERX_SCHEDULED_A2A_URL }}
          LAYERX_TENANT: ${{ vars.LAYERX_SCHEDULED_AGENT_TENANT }}
          LAYERX_ACTOR: ${{ vars.LAYERX_SCHEDULED_AGENT_ACTOR }}
          LAYERX_AUTHORITY: ${{ vars.LAYERX_SCHEDULED_AGENT_AUTHORITY }}
          LAYERX_FEE_LIMIT: ${{ vars.LAYERX_SCHEDULED_AGENT_FEE_LIMIT }}
          LAYERX_WEBHOOK_PUBLIC_KEYS_JSON: ${{ vars.LAYERX_SCHEDULED_WEBHOOK_PUBLIC_KEYS_JSON }}
          LAYERX_WEBHOOK_DELIVERY_STORE_PATH: ${{ runner.temp }}/layerx-webhook-deliveries-${{ matrix.framework }}.json
          LAYERX_WEBHOOK_DELIVERY_PATH: ${{ runner.temp }}/layerx-webhook-delivery.json
          LAYERX_TOKEN: ${{ secrets.LAYERX_SCHEDULED_AGENT_TOKEN }}
          LAYERX_SPEND_TOOL_INPUT_JSON: ${{ secrets.LAYERX_SCHEDULED_SPEND_TOOL_INPUT_JSON }}
        run: make platform-real-agent-integration

  real-ios-journey:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch a fresh signed webhook delivery from the real service
        env:
          LAYERX_WEBHOOK_FIXTURE_URL: ${{ vars.LAYERX_SCHEDULED_WEBHOOK_FIXTURE_URL }}
          LAYERX_WEBHOOK_FIXTURE_TOKEN: ${{ secrets.LAYERX_SCHEDULED_WEBHOOK_FIXTURE_TOKEN }}
        run: |
          test -n "$LAYERX_WEBHOOK_FIXTURE_URL"
          test -n "$LAYERX_WEBHOOK_FIXTURE_TOKEN"
          umask 077
          curl --silent --show-error --fail --proto '=https' --tlsv1.3 --max-time 30 \
            --header "authorization: Bearer $LAYERX_WEBHOOK_FIXTURE_TOKEN" \
            "$LAYERX_WEBHOOK_FIXTURE_URL" \
            --output "$RUNNER_TEMP/layerx-webhook-delivery.json"
          test -s "$RUNNER_TEMP/layerx-webhook-delivery.json"
      - name: Execute the Swift mobile integration through the real service stack
        env:
          LAYERX_SERVICE_URL: ${{ vars.LAYERX_SCHEDULED_HUMAN_SERVICE_URL }}
          LAYERX_SESSION_BROKER_URL: ${{ vars.LAYERX_SCHEDULED_SESSION_BROKER_URL }}
          LAYERX_EVENT_PUBLIC_KEY_PROD: ${{ vars.LAYERX_SCHEDULED_EVENT_PUBLIC_KEY }}
          LAYERX_RECEIPT_RELAY_URL: ${{ vars.LAYERX_SCHEDULED_RECEIPT_RELAY_URL }}
          LAYERX_SAMPLE_ASSET: ${{ vars.LAYERX_SCHEDULED_ASSET }}
          LAYERX_SAMPLE_RECIPIENT: ${{ vars.LAYERX_SCHEDULED_RECIPIENT }}
          LAYERX_SAMPLE_AMOUNT: "1"
          LAYERX_SAMPLE_QUOTE_JSON: ${{ vars.LAYERX_SCHEDULED_MOVE_QUOTE_JSON }}
          LAYERX_SAMPLE_IDEMPOTENCY_KEY: mobile-ios-${{ github.run_id }}-${{ github.run_attempt }}
          LAYERX_SAMPLE_WEBHOOK_DELIVERY_PATH: ${{ runner.temp }}/layerx-webhook-delivery.json
        run: make platform-real-ios-integration

  real-android-journey:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch a fresh signed webhook delivery from the real service
        env:
          LAYERX_WEBHOOK_FIXTURE_URL: ${{ vars.LAYERX_SCHEDULED_WEBHOOK_FIXTURE_URL }}
          LAYERX_WEBHOOK_FIXTURE_TOKEN: ${{ secrets.LAYERX_SCHEDULED_WEBHOOK_FIXTURE_TOKEN }}
        run: |
          test -n "$LAYERX_WEBHOOK_FIXTURE_URL"
          test -n "$LAYERX_WEBHOOK_FIXTURE_TOKEN"
          umask 077
          curl --silent --show-error --fail --proto '=https' --tlsv1.3 --max-time 30 \
            --header "authorization: Bearer $LAYERX_WEBHOOK_FIXTURE_TOKEN" \
            "$LAYERX_WEBHOOK_FIXTURE_URL" \
            --output "$RUNNER_TEMP/layerx-webhook-delivery.json"
          test -s "$RUNNER_TEMP/layerx-webhook-delivery.json"
      - name: Execute the generated-JVM mobile integration through the real service stack
        env:
          LAYERX_SERVICE_URL: ${{ vars.LAYERX_SCHEDULED_HUMAN_SERVICE_URL }}
          LAYERX_SESSION_BROKER_URL: ${{ vars.LAYERX_SCHEDULED_SESSION_BROKER_URL }}
          LAYERX_EVENT_PUBLIC_KEY_PROD: ${{ vars.LAYERX_SCHEDULED_EVENT_PUBLIC_KEY }}
          LAYERX_RECEIPT_RELAY_URL: ${{ vars.LAYERX_SCHEDULED_RECEIPT_RELAY_URL }}
          LAYERX_SAMPLE_ASSET: ${{ vars.LAYERX_SCHEDULED_ASSET }}
          LAYERX_SAMPLE_RECIPIENT: ${{ vars.LAYERX_SCHEDULED_RECIPIENT }}
          LAYERX_SAMPLE_AMOUNT: "1"
          LAYERX_SAMPLE_QUOTE_JSON: ${{ vars.LAYERX_SCHEDULED_MOVE_QUOTE_JSON }}
          LAYERX_SAMPLE_IDEMPOTENCY_KEY: mobile-android-${{ github.run_id }}-${{ github.run_attempt }}
          LAYERX_SAMPLE_WEBHOOK_DELIVERY_PATH: ${{ runner.temp }}/layerx-webhook-delivery.json
        run: make platform-real-android-integration

  release-pipeline:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal
      - name: Install Node.js for npm middleware publication
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify the signed release registry manifest
        run: make platform-release-check
      - name: Verify the generated SDKs against the schemas
        run: make platform-build
      - name: Emit the machine-readable release plan
        run: make platform-release-plan | tee release-plan.txt
      - name: Record the reproducible source digest for byte-verification
        run: git archive --format=tar HEAD | sha256sum | tee source-digest.txt
      - name: Build the published middleware packages from the locked workspace
        run: >-
          npm ci --ignore-scripts --no-audit --no-fund &&
          npm run build --workspace @sidiora/layerx-buyer-middleware &&
          npm run build --workspace @sidiora/layerx-seller-middleware &&
          npm run build --workspace @sidiora/layerx-merchant-middleware &&
          npm run build --workspace @sidiora/layerx-agent-middleware
      - name: Publish the four middleware packages with provenance
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: >-
          npm publish --workspace @sidiora/layerx-buyer-middleware --access public --provenance &&
          npm publish --workspace @sidiora/layerx-seller-middleware --access public --provenance &&
          npm publish --workspace @sidiora/layerx-merchant-middleware --access public --provenance &&
          npm publish --workspace @sidiora/layerx-agent-middleware --access public --provenance

  hosted-testnet-journey:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js for hosted reference applications
        if: ${{ vars.LAYERX_REFERENCE_APPS_ENABLED == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust toolchain and journey tools
        run: >-
          rustup toolchain install 1.91.1 --profile minimal &&
          sudo apt-get update && sudo apt-get install --yes dbus-x11 gnome-keyring jq
      - name: Build the receipt-verifying CLI
        run: cargo build --locked --release --manifest-path platform/Cargo.toml -p layerx-platform-cli
      - name: Build middleware dependencies for the hosted reference applications
        if: ${{ vars.LAYERX_REFERENCE_APPS_ENABLED == 'true' }}
        run: >-
          npm ci --ignore-scripts --no-audit --no-fund &&
          npm run build --workspace @sidiora/layerx-buyer-middleware &&
          npm run build --workspace @sidiora/layerx-seller-middleware &&
          npm run build --workspace @sidiora/layerx-merchant-middleware
      - name: Materialize short-lived test credentials
        env:
          TESTNET_TOKEN: ${{ secrets.LAYERX_SCHEDULED_TESTNET_TOKEN }}
          TESTNET_CA_BASE64: ${{ secrets.LAYERX_SCHEDULED_TESTNET_CA_BASE64 }}
        run: |
          umask 077
          test -n "$TESTNET_TOKEN"
          test -n "$TESTNET_CA_BASE64"
          printf '%s' "$TESTNET_TOKEN" > "$RUNNER_TEMP/layerx-testnet-token"
          printf '%s' "$TESTNET_CA_BASE64" | base64 --decode > "$RUNNER_TEMP/layerx-testnet-ca.pem"
      - name: Fund, pay, fetch, and independently verify the receipt
        env:
          LAYERX_TESTNET_URL: https://testnet.layerx.network
          LAYERX_GATEWAY_URL: https://api.testnet.layerx.network
          LAYERX_FAUCET_URL: https://faucet.testnet.layerx.network
          LAYERX_TEST_AUTH_TOKEN_FILE: ${{ runner.temp }}/layerx-testnet-token
          LAYERX_TEST_CA_FILE: ${{ runner.temp }}/layerx-testnet-ca.pem
          LAYERX_TEST_SOURCE_DID: ${{ vars.LAYERX_SCHEDULED_SOURCE_DID }}
          LAYERX_TEST_SOURCE_PUBLIC_KEY: ${{ vars.LAYERX_SCHEDULED_SOURCE_PUBLIC_KEY }}
          LAYERX_TEST_DESTINATION_DID: ${{ vars.LAYERX_SCHEDULED_DESTINATION_DID }}
          LAYERX_TEST_ASSET: ${{ vars.LAYERX_SCHEDULED_ASSET }}
          LAYERX_TEST_AMOUNT: "1"
          LAYERX_BIN: platform/target/release/layerx
        run: make platform-hosted-smoke
      - name: Install MCP and A2A runtimes and complete real scoped payments
        env:
          LAYERX_BIN: platform/target/release/layerx
          LAYERX_GATEWAY_URL: https://api.testnet.layerx.network
          LAYERX_NETWORK_ID: ${{ vars.LAYERX_AGENT_INSTALL_NETWORK_ID }}
          LAYERX_IDENTITY_TOKEN: ${{ secrets.LAYERX_AGENT_INSTALL_IDENTITY_TOKEN }}
          LAYERX_SIGNING_SEED: ${{ secrets.LAYERX_AGENT_INSTALL_SIGNING_SEED }}
          LAYERX_SOURCE_ACCOUNT: ${{ vars.LAYERX_AGENT_INSTALL_SOURCE_ACCOUNT }}
          LAYERX_PAYMENT_ASSET: ${{ vars.LAYERX_AGENT_INSTALL_ASSET }}
          LAYERX_PAYMENT_DESTINATION: ${{ vars.LAYERX_AGENT_INSTALL_DESTINATION }}
          LAYERX_MCP_SEQUENCE: ${{ vars.LAYERX_AGENT_INSTALL_MCP_SEQUENCE }}
          LAYERX_A2A_SEQUENCE: ${{ vars.LAYERX_AGENT_INSTALL_A2A_SEQUENCE }}
        run: >-
          dbus-run-session -- bash -c '
          eval "$(printf "\n" | gnome-keyring-daemon --unlock)" &&
          make platform-test-agent-install'
      - name: Exercise the four reference applications against hosted testnet
        if: ${{ vars.LAYERX_REFERENCE_APPS_ENABLED == 'true' }}
        env:
          LAYERX_BIN: platform/target/release/layerx
          LAYERX_TESTNET_TOKEN: ${{ secrets.LAYERX_SCHEDULED_TESTNET_TOKEN }}
          LAYERX_TESTNET_SOURCE: ${{ vars.LAYERX_SCHEDULED_SOURCE_DID }}
          LAYERX_TESTNET_ASSET: ${{ vars.LAYERX_SCHEDULED_ASSET }}
          LAYERX_TESTNET_SELLER: ${{ vars.LAYERX_REFERENCE_SELLER }}
          LAYERX_TESTNET_MERCHANT: ${{ vars.LAYERX_REFERENCE_MERCHANT }}
          LAYERX_TESTNET_PRICE: "1"
          LAYERX_TESTNET_PAYMENT_KEY: ${{ vars.LAYERX_REFERENCE_PAYMENT_KEY }}
          LAYERX_TESTNET_MERCHANT_CHECKOUT_KEY: ${{ vars.LAYERX_REFERENCE_CHECKOUT_KEY }}
          LAYERX_TESTNET_WEBHOOK_PUBLIC_KEYS_JSON: ${{ vars.LAYERX_REFERENCE_WEBHOOK_KEYS_JSON }}
          LAYERX_TESTNET_MARKETPLACE_PROGRAM_ID: ${{ vars.LAYERX_REFERENCE_MARKETPLACE_PROGRAM_ID }}
          LAYERX_TESTNET_MARKETPLACE_LISTING_ID: ${{ vars.LAYERX_REFERENCE_MARKETPLACE_LISTING_ID }}
          LAYERX_TESTNET_MARKETPLACE_RECEIPT_DIGEST: ${{ vars.LAYERX_REFERENCE_MARKETPLACE_RECEIPT_DIGEST }}
          LAYERX_TESTNET_MARKETPLACE_KEY: ${{ vars.LAYERX_REFERENCE_MARKETPLACE_KEY }}
        run: node platform/examples/run-reference-apps.mjs --scenario testnet
