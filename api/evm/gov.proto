// PointerBindingProposal is a governance proposal content of the evm module.
// It carries the module's governance messages from tx.proto -
// MsgBindERCNativePointer - each packed under its type URL, and once the
// proposal passes the module's proposal handler executes them in order through
// the Msg service. Every message names the governance module account as its
// authority.
message PointerBindingProposal {
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;
  option (gogoproto.goproto_stringer) = false;

  string title = 1;
  string description = 2;
  repeated google.protobuf.Any messages = 3 [(cosmos_proto.accepts_interface) = "sdk.Msg"];
}
