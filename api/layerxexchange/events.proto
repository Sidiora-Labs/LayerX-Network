syntax = "proto3";
package paxprotocol.paxchain.layerxexchange;

option go_package = "github.com/sidiora-labs/paxeer-network/modules/layerxexchange/types";

// EventMarginDeposited mirrors the MarginDeposited EVM log.
message EventMarginDeposited {
  string intent_id = 1;
  string owner = 2;
  string account = 3;
  string asset_id = 4;
  string denom = 5;
  string amount = 6;
  string deposit_id = 7;
  uint64 nonce = 8;
}

// EventMarginWithdrawalRequested mirrors the MarginWithdrawalRequested EVM log.
message EventMarginWithdrawalRequested {
  string intent_id = 1;
  string owner = 2;
  string account = 3;
  string asset_id = 4;
  string amount = 5;
  uint64 nonce = 6;
}

// EventOrderPlaced mirrors the OrderPlaced EVM log.
message EventOrderPlaced {
  string intent_id = 1;
  string owner = 2;
  string market_id = 3;
  uint32 side = 4;
  string price = 5;
  string quantity = 6;
  uint32 time_in_force = 7;
  uint64 nonce = 8;
}

// EventOrderCancelRequested mirrors the OrderCancelRequested EVM log.
message EventOrderCancelRequested {
  string intent_id = 1;
  string owner = 2;
  string order_id = 3;
  uint64 nonce = 4;
}

// EventSettlementRequested mirrors the SettlementRequested EVM log.
message EventSettlementRequested {
  string intent_id = 1;
  string owner = 2;
  string position_id = 3;
  uint64 nonce = 4;
}
