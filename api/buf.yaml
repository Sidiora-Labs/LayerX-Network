version: v1
name: buf.build/pax-protocol/pax-chain
deps:
  - buf.build/pax-protocol/cosmos-sdk
  - buf.build/pax-protocol/third-party
breaking:
  use:
    - FILE
lint:
  use:
    - DEFAULT
    - COMMENTS
    - FILE_LOWER_SNAKE_CASE
  except:
    - UNARY_RPC
    - COMMENT_FIELD
    - SERVICE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
  ignore:
    - tendermint
