[workspace]
members = [
    "crates/layerx-programs-registry",
    "crates/layerx-programs-protocol-adapter",
    "crates/layerx-programs-interpreter",
    "crates/layerx-programs-runtime",
    "fuzz",
    "porting/cosmwasm",
    "porting/cosmwasm/guest",
    "porting/evm",
    "porting/evm/guest",
    "porting/solana",
    "porting/solana/guest",
    "sdk/rust",
    "sdk/rust/lint",
]
exclude = [
    "sdk/rust/examples/escrow",
    "sdk/rust/examples/vault",
    "sdk/rust/quickstart",
    "sdk/rust/response-fixture",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
license = "LicenseRef-Centra-ai-Protocol"

[workspace.dependencies]
wasmi = "=0.31.2"
wasmparser-nostd = "=0.100.2"
wasm-instrument = { path = "vendor/wasm-instrument", default-features = false, features = ["bulk", "reference_types", "sign_ext"] }
sha2 = { version = "=0.10.9", default-features = false }
sha3 = { version = "=0.10.8", default-features = false }
blake3 = { version = "=1.5.0", default-features = false }
ed25519-dalek = { version = "2.1", default-features = false, features = ["digest"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256"] }
num-bigint = { version = "0.4", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
