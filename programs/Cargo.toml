[workspace]
members = [
    "crates/layerx-programs-registry",
    "crates/layerx-programs-runtime",
    "fuzz",
    "porting/cosmwasm",
    "porting/evm",
    "porting/solana",
    "sdk/rust",
    "sdk/rust/lint",
]
exclude = ["sdk/rust/quickstart", "sdk/rust/response-fixture"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
license = "LicenseRef-Centra-ai-Protocol"

[workspace.dependencies]
wasmi = "=0.31.2"
wasmparser-nostd = "=0.100.2"
sha2 = { version = "=0.10.8", default-features = false }
sha3 = { version = "=0.10.8", default-features = false }
blake3 = { version = "=1.5.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
