[workspace]
members = [
    "crates/layerx-ap2",
    "crates/layerx-interop-gateway",
    "crates/layerx-interop-service",
    "crates/layerx-fiat",
    "crates/layerx-migrate",
    "crates/layerx-mirror",
    "crates/layerx-portable",
    "crates/layerx-ucp",
    "crates/layerx-visa-tap",
    "crates/layerx-x402",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
license = "LicenseRef-Centra-ai-Protocol"

[workspace.dependencies]
ed25519-dalek = "=2.2.0"
base64 = "=0.22.1"
layerx-types = { path = "../agent/crates/layerx-types" }
layerx-wire = { path = "../agent/crates/layerx-wire" }
layerx-crypto = { path = "../agent/crates/layerx-crypto" }
layerx-proof = { path = "../agent/crates/layerx-proof" }
layerx-interop-gateway = { path = "crates/layerx-interop-gateway" }
layerx-portable = { path = "crates/layerx-portable" }
layerx-intents = { path = "../human/crates/layerx-intents" }
layerx-agent-api = { path = "../agent/crates/layerx-agent-api" }
layerx-client = { path = "../agent/crates/layerx-client" }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"] }
openssl = "=0.10.73"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
sha3 = "=0.10.8"
subtle = "=2.6.1"
zeroize = "=1.9.0"
native-tls = "=0.2.15"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
subtle = "=2.6.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
