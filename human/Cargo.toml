[workspace]
members = [
    "crates/layerx-human-service",
    "crates/layerx-intents",
    "crates/layerx-paxeer-client",
    "crates/layerx-explorer-index",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
license = "LicenseRef-Centra-ai-Protocol"

[workspace.dependencies]
base64 = "=0.22.1"
getrandom = "=0.3.4"
layerx-agent-api = { path = "../agent/crates/layerx-agent-api" }
layerx-types = { path = "../agent/crates/layerx-types" }
layerx-wire = { path = "../agent/crates/layerx-wire" }
layerx-crypto = { path = "../agent/crates/layerx-crypto" }
layerx-proof = { path = "../agent/crates/layerx-proof" }
layerx-client = { path = "../agent/crates/layerx-client" }
layerx-sdk = { path = "../agent/crates/layerx-sdk" }
layerx-mirror = { path = "../interop/crates/layerx-mirror" }
layerx-programs = { package = "layerx-programs-registry", path = "../programs/crates/layerx-programs-registry" }
layerx-programs-protocol-adapter = { path = "../programs/crates/layerx-programs-protocol-adapter" }
layerx-agentd = { path = "../agent/crates/layerx-agentd" }
layerx-paxeer-client = { path = "crates/layerx-paxeer-client" }
layerx-intents = { path = "crates/layerx-intents" }
passkey-auth = "=0.1.3"
proptest = "=1.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
sha3 = "=0.10.8"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"] }
subtle = "=2.6.1"
zeroize = "=1.9.0"
rustix = { version = "=1.1.4", features = ["net", "process"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
