limit_req_zone $binary_remote_addr zone=hpx_register:10m rate=10r/m;

upstream hpx_registry {
    server 127.0.0.1:8099;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name node.hyperpaxeer.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name node.hyperpaxeer.com;

    ssl_certificate /etc/letsencrypt/live/node.hyperpaxeer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/node.hyperpaxeer.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HPXTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64k;

    location = /api/register {
        limit_req zone=hpx_register burst=5 nodelay;
        proxy_pass http://hpx_registry;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://hpx_registry;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 10m;
        send_timeout 10m;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    access_log /var/log/nginx/hpx-access.log;
    error_log /var/log/nginx/hpx-error.log;
}
