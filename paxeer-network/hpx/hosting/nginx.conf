# =============================================================================
# Nginx config for self-hosting the hpx installer
#
# Setup:
#   1. Copy files to /var/www/hpx/
#   2. Copy this config to /etc/nginx/sites-available/hpx
#   3. ln -s /etc/nginx/sites-available/hpx /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#
# Users install with:
#   curl -sSL https://node.hyperpaxeer.com/install | sudo bash
#
# Or override the mirror for hpx download:
#   HPX_MIRROR=https://your-server.com curl -sSL .../install | sudo bash
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name node.hyperpaxeer.com;

    root /var/www/hpx;
    index index.html;

    # Serve the installer script at /install
    location = /install {
        alias /var/www/hpx/get-hpx.sh;
        default_type text/plain;
        add_header Content-Disposition "inline";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Serve the CLI binary
    location = /hpx {
        alias /var/www/hpx/hpx;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=300";
    }

    # Serve the uninstaller
    location = /uninstall {
        alias /var/www/hpx/uninstall.sh;
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    # Version endpoint (for update checks)
    location = /version {
        alias /var/www/hpx/version.txt;
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    # Block everything else
    location / {
        return 301 https://github.com/sidiora-labs/layerx-protocol;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Logging
    access_log /var/log/nginx/hpx-access.log;
    error_log  /var/log/nginx/hpx-error.log;
}

